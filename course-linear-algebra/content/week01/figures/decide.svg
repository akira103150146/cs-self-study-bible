<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 230" width="660" role="img" aria-label="Decision flowchart: is the last column a pivot column; then, are there free variables">
  <defs>
    <marker id="ah-decide" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <!-- Q1 -->
  <rect class="box" x="10" y="20" width="210" height="64" rx="10"/>
  <text class="t" x="115" y="46" text-anchor="middle">Is the last column</text>
  <text class="t" x="115" y="66" text-anchor="middle">a pivot column?</text>
  <!-- yes → no solution -->
  <line class="arrow" x1="115" y1="84" x2="115" y2="146" marker-end="url(#ah-decide)"/>
  <text x="124" y="120">yes</text>
  <rect class="bad" x="25" y="150" width="180" height="50" rx="10"/>
  <text class="t" x="115" y="172" text-anchor="middle">No solution</text>
  <text x="115" y="190" text-anchor="middle">row [0 … 0 | b], b ≠ 0</text>
  <!-- no → Q2 -->
  <line class="arrow" x1="220" y1="52" x2="296" y2="52" marker-end="url(#ah-decide)"/>
  <text x="244" y="44">no</text>
  <rect class="box" x="300" y="20" width="200" height="64" rx="10"/>
  <text class="t" x="400" y="46" text-anchor="middle">Any free</text>
  <text class="t" x="400" y="66" text-anchor="middle">variables?</text>
  <!-- no → unique -->
  <line class="arrow" x1="360" y1="84" x2="360" y2="146" marker-end="url(#ah-decide)"/>
  <text x="330" y="120">no</text>
  <rect class="hl" x="290" y="150" width="140" height="50" rx="10"/>
  <text class="t" x="360" y="172" text-anchor="middle">Exactly one</text>
  <text x="360" y="190" text-anchor="middle">solution</text>
  <!-- yes → infinitely many -->
  <path class="arrow" d="M500,52 L560,52 L560,146" marker-end="url(#ah-decide)"/>
  <text x="566" y="120">yes</text>
  <rect class="hl" x="470" y="150" width="180" height="50" rx="10"/>
  <text class="t" x="560" y="172" text-anchor="middle">Infinitely many</text>
  <text x="560" y="190" text-anchor="middle">solutions</text>
</svg>
