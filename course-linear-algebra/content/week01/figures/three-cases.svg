<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 215" width="660" role="img" aria-label="Three cases for two lines: one solution, no solution, infinitely many">
  <!-- Panel 1: one solution -->
  <g transform="translate(10,0)">
    <text class="t" x="100" y="18" text-anchor="middle">One solution</text>
    <line class="ax" x1="10" y1="120" x2="190" y2="120"/>
    <line class="ax" x1="100" y1="32" x2="100" y2="190"/>
    <line class="l1" x1="20" y1="170" x2="180" y2="50"/>
    <line class="l2" x1="20" y1="70" x2="180" y2="160"/>
    <circle class="pt" cx="96.2" cy="112.9" r="5"/>
    <text x="100" y="208" text-anchor="middle">lines cross once</text>
  </g>
  <!-- Panel 2: no solution -->
  <g transform="translate(230,0)">
    <text class="t" x="100" y="18" text-anchor="middle">No solution</text>
    <line class="ax" x1="10" y1="120" x2="190" y2="120"/>
    <line class="ax" x1="100" y1="32" x2="100" y2="190"/>
    <line class="l1" x1="20" y1="140" x2="180" y2="60"/>
    <line class="l2" x1="20" y1="180" x2="180" y2="100"/>
    <text x="100" y="208" text-anchor="middle">parallel lines</text>
  </g>
  <!-- Panel 3: infinitely many -->
  <g transform="translate(450,0)">
    <text class="t" x="100" y="18" text-anchor="middle">Infinitely many</text>
    <line class="ax" x1="10" y1="120" x2="190" y2="120"/>
    <line class="ax" x1="100" y1="32" x2="100" y2="190"/>
    <line class="l1" x1="20" y1="165" x2="180" y2="55" style="stroke-width:6;opacity:.55"/>
    <line class="l2d" x1="20" y1="165" x2="180" y2="55"/>
    <text x="100" y="208" text-anchor="middle">same line</text>
  </g>
</svg>
