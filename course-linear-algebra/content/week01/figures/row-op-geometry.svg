<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 245" width="640" role="img" aria-label="A replacement row operation changes one line but keeps the intersection point">
  <defs>
    <marker id="ah-rowop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <!-- 座標:x ∈ [-2,5] → px = 20 + (x+2)*38;y ∈ [-1,4] → py = 190 - (y+1)*34 -->
  <g>
    <text class="t" x="153" y="16" text-anchor="middle">Before</text>
    <line class="ax" x1="20" y1="156" x2="286" y2="156"/>
    <line class="ax" x1="96" y1="20" x2="96" y2="190"/>
    <line class="l1" x1="20" y1="173" x2="286" y2="54"/>
    <line class="l2" x1="20" y1="144.7" x2="286" y2="65.3"/>
    <circle class="pt" cx="210" cy="88" r="5"/>
    <text x="218" y="104">(3, 2)</text>
    <text x="30" y="212">teal:  x1 − 2x2 = −1</text>
    <text x="30" y="232">orange: −x1 + 3x2 = 3</text>
  </g>
  <g>
    <line class="arrow" x1="296" y1="110" x2="336" y2="110" marker-end="url(#ah-rowop)"/>
    <text x="316" y="98" text-anchor="middle">R2 + R1</text>
  </g>
  <g transform="translate(340,0)">
    <text class="t" x="153" y="16" text-anchor="middle">After  R2 ← R2 + R1</text>
    <line class="ax" x1="20" y1="156" x2="286" y2="156"/>
    <line class="ax" x1="96" y1="20" x2="96" y2="190"/>
    <line class="l1" x1="20" y1="173" x2="286" y2="54"/>
    <line class="l2" x1="20" y1="88" x2="286" y2="88"/>
    <circle class="pt" cx="210" cy="88" r="5"/>
    <text x="218" y="80">(3, 2)</text>
    <text x="30" y="212">teal:  x1 − 2x2 = −1  (unchanged)</text>
    <text x="30" y="232">orange: x2 = 2  (new line, same point)</text>
  </g>
</svg>
