<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" width="640" role="img" aria-label="Echelon form versus reduced echelon form: a staircase of pivots">
  <!-- 每格 44x40。pivot 格用 .hl 底色,樓梯線用 .stair。 -->
  <g transform="translate(20,34)">
    <text class="t" x="110" y="-14" text-anchor="middle">Echelon form</text>
    <rect class="box" x="0" y="0" width="220" height="120" rx="6"/>
    <!-- row 1 -->
    <rect class="hl" x="4" y="4" width="36" height="32" rx="5"/>
    <text class="pv" x="22" y="26" text-anchor="middle">■</text>
    <text class="m" x="66" y="26" text-anchor="middle">*</text><text class="m" x="110" y="26" text-anchor="middle">*</text>
    <text class="m" x="154" y="26" text-anchor="middle">*</text><text class="m" x="198" y="26" text-anchor="middle">*</text>
    <!-- row 2 -->
    <text class="m" x="22" y="66" text-anchor="middle">0</text>
    <rect class="hl" x="48" y="44" width="36" height="32" rx="5"/>
    <text class="pv" x="66" y="66" text-anchor="middle">■</text>
    <text class="m" x="110" y="66" text-anchor="middle">*</text><text class="m" x="154" y="66" text-anchor="middle">*</text>
    <text class="m" x="198" y="66" text-anchor="middle">*</text>
    <!-- row 3 -->
    <text class="m" x="22" y="106" text-anchor="middle">0</text><text class="m" x="66" y="106" text-anchor="middle">0</text>
    <text class="m" x="110" y="106" text-anchor="middle">0</text>
    <rect class="hl" x="136" y="84" width="36" height="32" rx="5"/>
    <text class="pv" x="154" y="106" text-anchor="middle">■</text>
    <text class="m" x="198" y="106" text-anchor="middle">*</text>
    <polyline class="stair" points="0,40 44,40 44,80 132,80 132,120"/>
  </g>

  <g transform="translate(300,95)">
    <line class="arrow" x1="0" y1="0" x2="34" y2="0"/>
    <polygon class="arrowhead" points="34,-5 44,0 34,5"/>
  </g>

  <g transform="translate(400,34)">
    <text class="t" x="110" y="-14" text-anchor="middle">Reduced echelon form (RREF)</text>
    <rect class="box" x="0" y="0" width="220" height="120" rx="6"/>
    <!-- row 1 -->
    <rect class="hl" x="4" y="4" width="36" height="32" rx="5"/>
    <text class="pv" x="22" y="26" text-anchor="middle">1</text>
    <text class="m" x="66" y="26" text-anchor="middle">0</text><text class="m" x="110" y="26" text-anchor="middle">*</text>
    <text class="m" x="154" y="26" text-anchor="middle">0</text><text class="m" x="198" y="26" text-anchor="middle">*</text>
    <!-- row 2 -->
    <text class="m" x="22" y="66" text-anchor="middle">0</text>
    <rect class="hl" x="48" y="44" width="36" height="32" rx="5"/>
    <text class="pv" x="66" y="66" text-anchor="middle">1</text>
    <text class="m" x="110" y="66" text-anchor="middle">*</text><text class="m" x="154" y="66" text-anchor="middle">0</text>
    <text class="m" x="198" y="66" text-anchor="middle">*</text>
    <!-- row 3 -->
    <text class="m" x="22" y="106" text-anchor="middle">0</text><text class="m" x="66" y="106" text-anchor="middle">0</text>
    <text class="m" x="110" y="106" text-anchor="middle">0</text>
    <rect class="hl" x="136" y="84" width="36" height="32" rx="5"/>
    <text class="pv" x="154" y="106" text-anchor="middle">1</text>
    <text class="m" x="198" y="106" text-anchor="middle">*</text>
    <polyline class="stair" points="0,40 44,40 44,80 132,80 132,120"/>
  </g>
  <text x="130" y="182" text-anchor="middle">■ = leading entry (nonzero)   * = any value</text>
  <text x="510" y="182" text-anchor="middle">pivots are 1, zeros above and below</text>
</svg>
