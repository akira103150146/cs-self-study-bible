<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 686.8 296.20000000000005" width="686.8" role="img" aria-label="A ray from the eye through the point meets the screen; similar triangles give x-star equals d times x over d minus z"><defs><marker id="ah-persp" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker></defs><g transform="translate(0,0)"><line class="ax" x1="137.6" y1="267.8" x2="137.6" y2="28.4"/><line class="ax" x1="104.0" y1="238.4" x2="599.6" y2="238.4"/><text class="t" x="147.6" y="30.4" text-anchor="start">screen (z = 0)</text><text class="t" x="597.6" y="256.4" text-anchor="end">z</text><line class="l1" x1="557.6" y1="238.4" x2="137.6" y2="70.4"/><circle class="pt" cx="557.6" cy="238.4" r="4"/><text class="t" x="567.6" y="230.4" text-anchor="start">eye (0, 0, d)</text><circle class="pt" cx="305.6" cy="137.6" r="4"/><text class="t" x="315.6" y="129.6" text-anchor="start">(x, y, z)</text><circle class="pt" cx="137.6" cy="70.4" r="4"/><text class="t" x="129.6" y="74.4" text-anchor="end">(x*, y*, 0)</text><line class="ax" x1="305.6" y1="238.4" x2="305.6" y2="137.6" stroke-dasharray="4 4"/><line class="ax" x1="137.6" y1="137.6" x2="305.6" y2="137.6" stroke-dasharray="4 4"/><text class="t" x="221.6" y="129.6" text-anchor="middle">x</text><text class="t" x="129.6" y="158.4" text-anchor="end">x*</text><line class="l2" x1="305.6" y1="259.4" x2="557.6" y2="259.4"/><text class="t" x="431.6" y="276.4" text-anchor="middle">d − z</text></g></svg>
