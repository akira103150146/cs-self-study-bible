<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 238" width="780" role="img" aria-label="Three mappings: not onto (the range is smaller than the codomain), not one-to-one (two inputs share an image), and one-to-one and onto"><defs><marker id="ah-map" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker></defs><text class="t" x="120" y="16" text-anchor="middle">not onto</text><ellipse class="hl" cx="50" cy="110" rx="38" ry="70" style="opacity:0.45"/><ellipse class="ax" cx="190" cy="110" rx="42" ry="78" style="opacity:1"/><ellipse class="bad" cx="190" cy="110" rx="32" ry="30" style="opacity:0.35"/><text x="50" y="198" text-anchor="middle">domain R^n</text><text x="190" y="206" text-anchor="middle">codomain R^m</text><circle class="pt" cx="50" cy="70" r="3.5"/><circle class="pt" cx="190" cy="90" r="3.5"/><line class="l1" x1="56" y1="70" x2="182" y2="90" marker-end="url(#ah-map)"/><circle class="pt" cx="50" cy="110" r="3.5"/><circle class="pt" cx="190" cy="110" r="3.5"/><line class="l1" x1="56" y1="110" x2="182" y2="110" marker-end="url(#ah-map)"/><circle class="pt" cx="50" cy="150" r="3.5"/><circle class="pt" cx="190" cy="130" r="3.5"/><line class="l1" x1="56" y1="150" x2="182" y2="130" marker-end="url(#ah-map)"/><text x="120" y="228" text-anchor="middle">some b is never hit</text><text class="t" x="380" y="16" text-anchor="middle">not one-to-one</text><ellipse class="hl" cx="310" cy="110" rx="38" ry="70" style="opacity:0.45"/><ellipse class="ax" cx="450" cy="110" rx="42" ry="78" style="opacity:1"/><ellipse class="bad" cx="450" cy="110" rx="32" ry="64" style="opacity:0.35"/><text x="310" y="198" text-anchor="middle">domain R^n</text><text x="450" y="206" text-anchor="middle">codomain R^m</text><circle class="pt" cx="310" cy="70" r="3.5"/><circle class="pt" cx="450" cy="100" r="3.5"/><line class="l1" x1="316" y1="70" x2="442" y2="100" marker-end="url(#ah-map)"/><circle class="pt" cx="310" cy="100" r="3.5"/><circle class="pt" cx="450" cy="100" r="3.5"/><line class="l1" x1="316" y1="100" x2="442" y2="100" marker-end="url(#ah-map)"/><circle class="pt" cx="310" cy="150" r="3.5"/><circle class="pt" cx="450" cy="135" r="3.5"/><line class="l1" x1="316" y1="150" x2="442" y2="135" marker-end="url(#ah-map)"/><text x="380" y="228" text-anchor="middle">two x's share one image</text><text class="t" x="640" y="16" text-anchor="middle">one-to-one and onto</text><ellipse class="hl" cx="570" cy="110" rx="38" ry="70" style="opacity:0.45"/><ellipse class="ax" cx="710" cy="110" rx="42" ry="78" style="opacity:1"/><ellipse class="bad" cx="710" cy="110" rx="32" ry="76" style="opacity:0.35"/><text x="570" y="198" text-anchor="middle">domain R^n</text><text x="710" y="206" text-anchor="middle">codomain R^m</text><circle class="pt" cx="570" cy="60" r="3.5"/><circle class="pt" cx="710" cy="55" r="3.5"/><line class="l1" x1="576" y1="60" x2="702" y2="55" marker-end="url(#ah-map)"/><circle class="pt" cx="570" cy="110" r="3.5"/><circle class="pt" cx="710" cy="110" r="3.5"/><line class="l1" x1="576" y1="110" x2="702" y2="110" marker-end="url(#ah-map)"/><circle class="pt" cx="570" cy="160" r="3.5"/><circle class="pt" cx="710" cy="165" r="3.5"/><line class="l1" x1="576" y1="160" x2="702" y2="165" marker-end="url(#ah-map)"/><text x="640" y="228" text-anchor="middle">every b hit exactly once</text></svg>
