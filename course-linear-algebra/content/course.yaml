# 課程層級的設定。週卡標題在該週還沒做之前用這裡的 outline;做了之後改用 weekNN/week.md 的標題。
name: 線性代數
dot: Ax
audience: 資工系 · 大一上
book: Lay《Linear Algebra and Its Applications》6e
tagline: 18 週,理論 3 小時 + 實作 3 小時。從解方程組一路走到 SVD 與 PCA——每個觀念先講清楚、老師完整示範、學生練熟,再到實作課用 Python 驗證。

# 每週實作 notebook 的第一格
lab_setup: |
  import numpy as np
  import sympy as sp
  from sympy import Matrix
  import matplotlib.pyplot as plt

outline:
  1: [線性方程組與列化簡, Lay 1.1–1.2 · 方程組、增廣矩陣、RREF]
  2: [向量方程與 Ax = b, Lay 1.3–1.4 · Span、矩陣乘向量的兩種看法]
  3: [解集結構與線性獨立, Lay 1.5、1.7 · 特解加齊次解、線性相依]
  4: [線性變換, Lay 1.8–1.9 · 標準矩陣、圖形變換、訊號濾波]
  5: [矩陣乘法與反矩陣, Lay 2.1–2.2、2.7 · 乘法就是合成、齊次座標、鄰接矩陣]
  6: [可逆矩陣定理與 LU 分解, Lay 2.3、2.5 · 電腦實際怎麼解方程組]
  7: [子空間、基底與秩, Lay 2.8–2.9 · Col / Nul、Rank Theorem、Hamming 碼]
  8: [行列式, Lay Ch3 · 面積縮放與可逆判準]
  9: [期中考, 範圍 W1–W8]
  10: [特徵值與特徵向量, Lay 5.1–5.2 · 方向不變的向量]
  11: [對角化與動態系統, Lay 5.3、5.6 · Aᵏ 的長期行為]
  12: [Power method 與 PageRank, Lay 5.8–5.9、10.2 · Markov 鏈的穩態]
  13: [內積、正交與投影, Lay 6.1–6.3 · cosine similarity]
  14: [最小平方與線性模型, Lay 6.4–6.6 · QR、迴歸、曲線擬合]
  15: [對稱矩陣與二次型, Lay 7.1–7.2 · 譜定理、共變異數矩陣]
  16: [SVD 與 PCA, Lay 7.4–7.5 · 影像壓縮]
  17: [Capstone:用 NumPy 做 PCA, 手寫數字降維與重建]
  18: [證明總整理與期末考, 15 個證明時刻串成一張圖]
