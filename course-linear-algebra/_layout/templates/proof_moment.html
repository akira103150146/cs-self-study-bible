{#- 證明時刻:學生版看得到定理、為什麼值得證、關鍵想法,並留空間跟著老師寫;完整證明只在教師版。 -#}
{%- set p = week.proof %}
<section class="proof-moment" id="proof">
  <div class="pm-head">🎯 證明時刻 · {{ p.title_zh }}</div>
  <div class="statement">{{ p.statement }}</div>
  <div class="pm-part"><span class="lbl">為什麼值得證</span>{{ p.why }}</div>
  <div class="pm-part"><span class="lbl">關鍵想法</span>{{ p.key_idea }}</div>
  {%- if teacher %}
  <div class="deep"><div class="deep-head"><span class="tag">證明</span>完整推導</div><div class="deep-body">{{ p.proof }}</div></div>
  {%- else %}
  {{ ui.workspace("跟著老師寫下證明", tall=True) }}
  {%- endif %}
</section>
