name: 計算機概論
dot: "01"
audience: 資工系 · 大學部
book: Dale & Lewis《Computer Science Illuminated》7e(以目錄為大綱,內容自編)
tagline: 18 章,每章四件:觀念講義 → 筆試題庫 → 核心 Lab → 延伸專案。系統主線用 C 從位元蓋到一台會跑程式的電腦,應用主線用 Python 走過資料庫、AI、網路與資安。

