<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 380" width="440" role="img" aria-label="Sixteen 4-bit patterns on a circle with their two's complement values">
<circle class="ax" cx="220" cy="190" r="140"/>
<circle class="hl" cx="220.0" cy="50.0" r="21"/>
