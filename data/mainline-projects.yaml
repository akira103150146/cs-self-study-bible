        - "class DSU(n)                        # 元素 0..n-1;超出範圍 → IndexError"
        - "find(x) -> int                      # 完整的路徑壓縮(整條路都直接指到根);用迴圈,不能用遞迴"
        - "union(a, b) -> bool                 # 依大小合併:小的根接到大的根下;一樣大時,第二個(b 的根)接到第一個(a 的根)下;本來就同一組回傳 False"
        - "same(a, b) -> bool;size_of(x) -> int"
        - "components() -> list[list[int]]     # 每組由小到大排,組之間依最小元素排"
