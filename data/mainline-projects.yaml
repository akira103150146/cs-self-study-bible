    - {id: cp3.attack-suite, name: 攻擊套件, visibility: hidden, checkpoint: proj-be-secure-deploy, consumes: [bookapi/auth, bookapi/api, bookapi/repo], description: "SQLi、XSS、越權的攻擊腳本全部擋下,功能測試照樣全過(和資安 webfix 共用同一份攻擊套件)。"}
