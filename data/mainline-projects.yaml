# ═════════════════════════════ A1 nn(詳細;v1 純 Python,nn/arrays 要 AI 層 numpy) ═════════════════════════════
- id: nn
  code: A1
  name: 從 micrograd 到 MNIST
  track: ai
  lib: nn
  project: proj-ai-mnist
  checkpoints: [proj-ai-mnist]
  level: 大學(高中進階可)
  status: detailed
  summary: "自己寫自動微分引擎、多類別邏輯迴歸與評估指標、最佳化器與多層感知機,不用框架辨識手寫數字。第一版(v1)全部是純 Python 標準函式庫,資料是 8×8 的手寫數字;只有 numpy 的「陣列運算」任務要等判題機的 AI 層。"
  note: "v1 決定(2026-10-26,書端;9Jang 可推翻):判題沙盒沒有 numpy,所以 nn/value、nn/linear、nn/optim、nn/mlp 都是純 Python,Boss 用 UCI「Optical Recognition of Handwritten Digits」的 8×8 版(E. Alpaydin、C. Kaynak,UCI ML Repository,CC BY 4.0,doi:10.24432/C50P49)。tra 與 tes 兩個檔合起來 5,620 張,用固定 seed 分成公開的 4,000 張(放在任務資料夾)與隱藏的 1,620 張;seed 只在 9Jang 的任務套件裡。為什麼不用 MNIST 28×28:純 Python 的 784-64-10 網路一個 epoch 要幾十秒,判題機跑不動;numpy 版的 MNIST 列在 future_acceptance(mnist-28),等 AI 層定案。為什麼不用 UCI 原本的切法(30 個人訓練、13 個人測試):參考解在那份測試集多半只有 95–96.6%(numpy 版、更大的網路偶爾 97.2%),門檻定 97% 會變成碰運氣;合併後用固定的切法(9Jang 套件保管 seed;書端在 12 種切法裡挑線性模型最弱、MLP 最穩的一種)。門檻 96.5% 的理由(2026-10-26 書端實測,numpy 等價的 64-64-10、He 初始化、Adam、batch 32、像素除以 16,固定切法上 100 個初始化 seed):lr 3e-3、15 個 epoch 最低 97.16%;lr 1e-3、15 個 epoch 最低 96.79%;lr 3e-3、8 個 epoch 最低 96.48%(99/100 過);boss.baseline 的線性模型(lr 0.5、10 個 epoch)95.80%。誠實寫對、照 Lab 方框的建議訓練的 MLP 至少 99% 的 seed 過得了;原本的 97% 在隨機切法上有 8–21% 的組合過不了。代價:線性模型練很久(lr 0.5、50 個 epoch)也有 96.98%,96.5% 分不太出 MLP 與線性模型,所以 train_digits 規定必須用 nn.mlp 的 MLP(結構檢查)。訓練很慢的 Value 計算圖只拿來做梯度檢查;真正訓練用手推的反向傳播(和 Value 的結果必須一致,這就是 Boss 的梯度檢查)。效能數字是 i7-12700KF／Python 3.12.3 的 CPU 秒;numpy 是 2.5、單執行緒(OMP_NUM_THREADS=1)。"
  acceptance:
    - id: boss.mnist
      name: 手寫數字辨識
      consumes: [nn/mlp, nn/optim]
      description: "禁用框架、純 Python:判題機把公開的 4,000 張 8×8 手寫數字(0–16 的整數像素)交給你的 train_digits,再用回傳的模型預測隱藏的 1,620 張,準確率至少 96.5%。"
      perf: {statement: "train_digits(4,000 張)＋predict(1,620 張)合計 180 秒內(建議 15 個 epoch;每個 epoch 卡在 mlp.perf 的 6 秒也只用 90 秒)", seconds: 180, n: 4000, budget: {mlp.perf: 90}, usage: {mlp.perf: 15}}
      perf_ref: "純 Python 參考解 64-64-10、Adam、batch 32:每個 epoch 1.28 秒,15 個 epoch 訓練約 19 秒＋預測 0.3 秒。準確率是固定切法上的 numpy 等價實作(見 note):lr 3e-3、15 個 epoch 100 個 seed 平均 97.82%、最低 97.16%"
    - {id: boss.gradcheck, name: 梯度檢查, consumes: [nn/mlp, nn/value], description: "隱藏的小網路(2–4 層、有沒有 L2 都有):你手推的 loss_and_backward、你的 Value 自動微分、有限差分,三者算出的梯度一致(對有限差分相對誤差 1e-5 內,對 Value 1e-9 內)。", perf: {statement: "最多 4 個隱藏網路,每個的 value_loss 計算圖最多 2×10^5 個節點:建圖＋backward＋有限差分,批改 40 秒內(估計值;每張圖卡在 value.perf 的 4 秒,4 張也只用 16 秒)", seconds: 40, budget: {value.perf: 20}, usage: {value.perf: 4}}}
    - {id: boss.report, name: 評估報告, consumes: [nn/linear, nn/mlp], description: "用你的 nn.metrics 對 Boss 的預測算混淆矩陣、每一類與 macro 的 precision／recall／F1、最常搞混的 3 對數字,結果和判題機算的一樣。"}
    - id: boss.baseline
      name: 線性基準線
      consumes: [nn/linear]
      description: "先做基準線:SoftmaxRegression 用公開的 4,000 張訓練(像素除以 16、lr=0.5、10 個 epoch、batch 32、seed 0),隱藏測試集準確率至少 95%。Boss 的 MLP 要比它好。"
      perf: {statement: "fit＋predict 10 秒內", seconds: 10, n: 4000}
      perf_ref: "fit 1.70 秒;準確率 95.80%(固定切法;舊的隨機切法是 96.6%)"
    - id: boss.knn
      name: 向量化 kNN
      requires_layer: numpy
      consumes: [nn/arrays]
      description: "要 AI 層(numpy):你的 knn_predict(k=3)用公開的 4,000 張分類隱藏的 1,620 張,準確率至少 97%。不用訓練,但每一張都要和全部訓練資料比距離,所以一定要向量化。"
      perf: {statement: "4,000 張訓練、1,620 張查詢、64 維、k=3,2 秒內(單執行緒)", seconds: 2, n: 1620}
      perf_ref: "0.35 秒,準確率 98.5%(舊的隨機切法;固定切法上 9Jang 要重測);純 Python 迴圈版約 50 秒"
  future_acceptance:
    - {id: mnist-28, name: MNIST 28×28, requires_layer: numpy, consumes: [nn/arrays, nn/mlp], description: "AI 層定案後:numpy 版的 MLP 在 MNIST 子集(訓練 1 萬張、隱藏測試 2 千張)準確率至少 97%,訓練 120 秒內(估計值;tree.yaml 原本的驗收寫的是這個)。"}
    - {id: deep-train-loop, name: 訓練迴圈給 proj-ai-deep, consumes: [nn/value, nn/optim], description: "影像分類＋迷你 GPT 專題沿用你的 zero_grad → backward → step 迴圈(之後再設計)。"}
  tasks:
    - id: nn/arrays
      order: 1
      name: 陣列運算
      files: [nn/arrays.py]
      language: python
      requires_layer: numpy
      chapter: "132-numpy-pandas:本章 Lab:陣列運算 nn/arrays.py"
      evidenceFor: [ai-numpy]
      consumes: []
      lab_no: L1
      anchor: lab-nn-arrays
      used_by: [boss.knn]
      note: "要 AI 層(判題映像有 numpy);待決見 data/README。和第 132 章範例的差別(給章作者):章裡可以示範 for 迴圈版與三維廣播版 ((A[:, None] − B[None]) ** 2).sum(-1)(1,620×4,000×64 要 3 GB 記憶體,過不了效能組),但不要寫出 Lab 要的展開式、夾 0、uint8 先轉 float、穩定的同票規則。手算(132):廣播後的形狀(參數化,答案是形狀或「不相容」)。反例題建議:「兩個形狀的維度數不同就不能廣播」(反例 (3, 1) 和 (4,))。"
      interface:
        - "所有函式:輸入可以是 list 或 ndarray,函式內先 np.asarray(...) 再算"
        - "broadcast_shape(*shapes) -> tuple            # 照 NumPy 的廣播規則算結果形狀(從最後一維往前比);不相容 → ValueError;不准呼叫 np.broadcast_shapes"
        - "standardize(X, axis=0, eps=1e-8) -> (Z, mean, std)   # mean、std 保留維度(keepdims);std < eps 的位置當成 1(不產生 nan);任何 axis(含負數)"
        - "one_hot(y, n_classes) -> ndarray              # 形狀 (len(y), n_classes)、float;標籤 < 0 或 ≥ n_classes → ValueError"
        - "softmax(Z, axis=-1) -> ndarray                # 數值穩定(先減掉那一軸的最大值);沿著 axis 加起來是 1"
