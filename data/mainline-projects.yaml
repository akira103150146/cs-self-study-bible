    - id: nn/value
      order: 2
      name: 自動微分
      files: [nn/value.py]
      language: python
      chapter: "111-deep-learning-math:本章 Lab:自動微分 nn/value.py"
      evidenceFor: [ai-mlp]
      consumes: []
      lab_no: L2
      anchor: lab-nn-value
      also_chapters: [12-calculus]
      used_by: [nn/mlp]
      note: "改寫自 karpathy/micrograd(MIT,Andrej Karpathy 2020;書裡附出處)。和 micrograd 的差別:build_topo 是遞迴(深度 1,000 就 RecursionError,這裡要用迴圈到 10^5);同一張圖 backward 兩次會把中間節點的梯度越加越大(這裡規定只有葉節點累加);_prev 是 set(這裡 parents 是有順序的 tuple);engine 只有 relu(這裡多 exp、log、tanh、sigmoid);** 的指數是 Value 時用 assert(這裡 TypeError);另外多 topo、zero_grad、check 與 numeric_grad。第 111 章〈動手實驗室:一百行寫出自動微分引擎〉照原作保留 micrograd 的 Value(遞迴的 build_topo、set 的 _prev、只有 + * ** relu),9Jang 拿它當突變版。手算(111,運算式答案):小計算圖的反向傳播,例如 L = c·tanh(w·x + b) 的 ∂L/∂w = c·(1 − tanh²(w·x + b))·x(每人數字不同);同一個節點用兩次時梯度相加。反例題建議:「有限差分的 h 越小越準」(h = 1e-12 時捨入誤差反而變大)、「ReLU 處處可微」。"
      interface:
        - "class Value(data)                       # data 是 int 或 float(存成 float);bool、字串、Value → TypeError;屬性 data、grad(初值 0.0);可以多加有預設值的參數(例 Value(data, parents=(), op='', arg=None)),判題只用一個參數呼叫"
        - "+ − × ÷ 與 r 版本(2 * x、1 / x)、-x;x ** k(k 是 int 或 float;k 是 Value → TypeError)   # 另一邊是數字時自動包成 Value;− 與 ÷ 用 +、*、** 組出來"
        - "exp()、log()(data ≤ 0 → ValueError)、tanh()、relu()(relu 在 0 的梯度是 0)、sigmoid()(很大的負數也不能 OverflowError)"
        - "topo() -> list[Value]                   # 從自己往回走得到的每個節點各一次,parents 一定排在它前面;用迴圈,不能用遞迴(深度到 10^5)"
        - "backward() -> None                      # 圖上非葉節點的 grad 先歸零、自己加 1,再照 topo 的反向傳;葉節點(沒有 parents)的 grad 是累加的,兩次 backward 會加起來"
        - "zero_grad() -> None                     # 圖上每個節點(含葉節點)的 grad 設成 0.0"
        - "check() -> bool                         # 不變式:圖上每個非葉節點的 data 等於用 op、arg 與 parents 重算的值(相對誤差 1e-9 內);check、zero_grad 也不能用遞迴"
        - "numeric_grad(f, xs, h=1e-5) -> list[float]   # 中央差分 (f(x+h) − f(x−h)) / 2h,一次動一個座標;f 收 list[float]、回傳 float;不改 xs"
      internal: "self.parents:tuple[Value, ...](依運算元的順序);self.op:'' | '+' | '*' | '**' | 'exp' | 'log' | 'tanh' | 'relu' | 'sigmoid';self.arg:** 的指數,其他是 None(規格規定,隱藏檢定會故意改壞 data 與 parents)"
      invariants:
        - name: value.invariant
          kind: function
          symbol: Value.check
          sabotage: {attr: [data, parents], breaks: [corrupt-node-data, swap-parent]}
      groups:
        - {id: value.ops, name: 四則與次方, kind: function, visibility: public, requiredBy: [boss.gradcheck], description: "+ − × ÷ ** 的值與梯度對公開範例;數字在左邊也可以(2 * x、1 / x、3 - x)。"}
        - {id: value.unary, name: 單元運算, kind: function, visibility: public, requiredBy: [boss.gradcheck, mlp.gradcheck], description: "exp、log、tanh、relu、sigmoid 的值與梯度對公開範例。"}
        - {id: value.reuse, name: 同一個節點用好幾次, kind: spec, visibility: public, requiredBy: [boss.gradcheck], description: "x * x、x + x、菱形的圖:每條路徑的梯度要加起來。"}
        - {id: value.numgrad, name: 有限差分, kind: function, visibility: public, requiredBy: [boss.gradcheck], description: "numeric_grad 對公開範例,和 backward 的結果差 1e-6 以內。"}
        - {id: value.gradcheck, name: 隨機運算式, kind: function, visibility: hidden, requiredBy: [boss.gradcheck], description: "隨機產生的運算式(最多 200 個節點,混合全部運算):backward 的梯度對有限差分,相對誤差 1e-6 內。"}
        - {id: value.accumulate, name: 梯度累加, kind: spec, visibility: hidden, requiredBy: [mlp.spec, boss.gradcheck], description: "同一張圖 backward 兩次,葉節點的梯度變兩倍、中間節點不會越加越大;兩個 loss 共用參數時梯度相加;zero_grad 之後全部是 0;對中間節點呼叫 backward。"}
        - {id: value.edge, name: 邊界, kind: edge, visibility: hidden, requiredBy: [boss.gradcheck], description: "relu(0) 的梯度是 0;tanh(±50)、sigmoid(−1000) 不溢位;x ** 0;0 ** 2 的梯度;int 的 data 存成 float;只有一個葉節點的圖。"}
        - {id: value.errors, name: 錯誤處理, kind: error, visibility: hidden, requiredBy: [boss.gradcheck], description: "log(0) 與 log(負數) 要 ValueError;Value ** Value、Value + 字串、Value(True) 要 TypeError。"}
        - {id: value.deep, name: 很深的圖, kind: edge, visibility: hidden, requiredBy: [mlp.gradcheck, boss.gradcheck], description: "10^5 層的長鏈:topo、backward、zero_grad、check 都不能 RecursionError;topo 的順序 parents 在前、每個節點只出現一次。"}
        - {id: value.invariant, name: 計算圖一直一致, kind: invariant, visibility: hidden, requiredBy: [boss.gradcheck], description: "隨機運算的每一步之後 check() 都成立;故意改掉中間節點的 data 或換掉它的一個 parent 時,check() 要抓得到。"}
        - id: value.perf
          name: 效能
          kind: perf
          visibility: hidden
          description: "建圖與 backward 都要 O(節點數)(不能每個節點重掃一次整張圖)。"
          perf: {statement: "建一條 10^5 步的長鏈(約 2×10^5 個節點)再 backward,4 秒內", seconds: 4, n: 200000}
          perf_ref: "0.84 秒(審查時同型 CPU 0.83 秒;9Jang 規則 max(1 秒, 參考解 × 4) → 4 秒)"
          requiredBy: [mlp.gradcheck, boss.gradcheck]

    - id: nn/linear
      order: 3
      name: 邏輯迴歸與指標
      files: [nn/linear.py, nn/metrics.py]
      language: python
      chapter: "38-machine-learning:本章 Lab:邏輯迴歸與指標 nn/linear.py"
      evidenceFor: [ai-ml-basics]
      consumes: []
      lab_no: L3
      anchor: lab-nn-linear
      used_by: [nn/mlp, boss.baseline, boss.report]
      note: "多類別邏輯迴歸(softmax 迴歸)。和第 38 章範例的差別:書的 logistic_train、cross_entropy、f1_score 是 numpy 的二元分類,交叉熵加 eps=1e-9、F1 的分母加 1e-9;Lab 是純 Python 的多類別版,交叉熵用 log-sum-exp(不准加 eps)、加 L2、回傳每個 epoch 的損失,指標是 k×k 混淆矩陣、macro／micro／每類的 precision／recall／F1(分母是 0 時那一項算 0.0,不是 0.9999…)、top_confusions 與錯誤處理。原本大綱的 consumes nn/arrays 拿掉(v1 不用 numpy)。手算(38):混淆矩陣 → 每類與 macro／micro 的 P／R／F1(數值答案);softmax＋交叉熵的 ∂L/∂z = ŷ − y(111 已有推導,手算填數字)。反例題建議:「準確率 99% 就是好模型」(99:1 不平衡的資料,全猜多數類)。"
      interface:
        - "softmax(z) -> list[float];log_softmax(z) -> list[float]   # 一筆 logits;先減最大值,z 裡有 1000 也不溢位"
        - "cross_entropy(logits, y) -> float          # logits:list[list[float]]、y:list[int];平均的 −log_softmax(z)[y](log-sum-exp,不能加 eps)"
        - "class SoftmaxRegression(n_features, n_classes, l2=0.0)   # W:n_classes×n_features 的 list[list[float]]、b:list[float],都從 0 開始"
        - "loss_and_grad(X, y) -> (loss, dW, db)      # 平均交叉熵＋l2/2·ΣW²(b 不算);∂L/∂z = softmax(z) − onehot(y),再對批次取平均"
        - "fit(X, y, lr=0.1, epochs=100, batch_size=None, seed=0) -> list[float]   # 每批更新一次 W -= lr·dW、b -= lr·db(最後不滿一批也算);batch_size=None 是全批次(不洗牌);給了 batch_size 就洗牌:rng = random.Random(seed) 在 fit 開頭只建一次,idx = list(range(len(X))),每個 epoch 先 rng.shuffle(idx)(對同一個 idx 原地再洗,不重建),再依序每 batch_size 個切一批;回傳每個 epoch 的平均損失(更新前算、依筆數加權)"
        - "predict_proba(X) -> list[list[float]];predict(X) -> list[int]   # 同分取最小的類別"
        - "nn/metrics.py:accuracy(y_true, y_pred) -> float"
        - "nn/metrics.py:confusion_matrix(y_true, y_pred, n_classes=None) -> list[list[int]]   # cm[真][預測];n_classes 預設是兩邊出現過的最大標籤 + 1"
        - "nn/metrics.py:precision_recall_f1(y_true, y_pred, average='macro') -> (p, r, f1)   # average='macro' | 'micro' | None(None 回傳三個 list,每類一個);類別數 K = 兩邊出現過的最大標籤 + 1(和 confusion_matrix 的預設一樣);macro 是每一類的 P、R、F1 各自平均(macro F1 是每類 F1 的平均,不是拿 macro P、R 再算一次),兩邊都沒出現的類別照樣算進 macro 的除數(它的 P、R、F1 都是 0.0);分母是 0 時那一項算 0.0;micro 平均永遠等於 accuracy(單標籤分類)"
        - "nn/metrics.py:top_confusions(cm, k=3) -> list[tuple[int, int, int]]   # (真, 預測, 次數):對角線以外最大的 k 格,次數多到少;同次數時真類別小的先,真類別也一樣時預測類別小的先;次數 0 的不列"
        - "錯誤:長度不同、空的輸入、負的標籤、標籤 ≥ n_classes、不認得的 average → ValueError"
      forbid: [numpy, sklearn, torch]
      groups:
        - {id: linear.softmax, name: softmax 與交叉熵, kind: function, visibility: public, requiredBy: [mlp.loss, boss.baseline], description: "softmax、log_softmax、cross_entropy 對公開範例。"}
        - {id: linear.fit, name: 訓練與預測, kind: function, visibility: public, requiredBy: [boss.baseline], description: "loss_and_grad 對公開範例;三群分得開的小資料 fit 之後 predict 全對、損失一直下降。"}
        - {id: linear.metrics, name: 評估指標, kind: function, visibility: public, requiredBy: [boss.report], description: "accuracy、confusion_matrix、precision_recall_f1(macro、micro、None;macro F1 是每類 F1 的平均)、top_confusions(同次數時真類別小的先)對公開範例。"}
        - {id: linear.grad, name: 梯度檢查, kind: function, visibility: hidden, requiredBy: [boss.baseline, mlp.loss], description: "隨機的 W、b、資料與 l2:loss_and_grad 的梯度對有限差分,相對誤差 1e-6 內。"}
        - {id: linear.stable, name: 數值穩定, kind: edge, visibility: hidden, requiredBy: [mlp.loss, boss.baseline], description: "logits 有 ±1000、全部相同、只有一類;損失不能是 inf 或 nan;predict 同分取最小的類別。"}
        - {id: linear.metrics-edge, name: 指標的邊界, kind: edge, visibility: hidden, requiredBy: [boss.report], description: "某一類從來沒被預測(precision 的分母是 0)、某一類沒出現(recall 的分母是 0)、全部答對、n_classes 比出現過的大(confusion_matrix 給了比較大的 n_classes;precision_recall_f1 則是中間有類別兩邊都沒出現);micro 平均永遠等於 accuracy(單標籤分類)。"}
        - {id: linear.errors, name: 錯誤處理, kind: error, visibility: hidden, requiredBy: [boss.report, boss.baseline], description: "長度不同、空的輸入、負的標籤、標籤 ≥ n_classes、不認得的 average,都要 ValueError。"}
        - id: linear.perf
          name: 效能
          kind: perf
          visibility: hidden
          description: "每批的前向與梯度都是 O(批次 × 特徵 × 類別);不能每筆重算整個資料集。"
