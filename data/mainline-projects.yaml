  tasks:
    - id: srv/http
      order: 1
      name: HTTP 伺服器
      files: [srv/http.py]
      language: python
      chapter: "25-networking:本章 Lab:HTTP 伺服器 srv/http.py"
      evidenceFor: [be-networking]
      consumes: []
      lab_no: L1
      anchor: lab-srv-http
      used_by: [srv/pool, bookapi/api]
      interface:
        - "class BadRequest(Exception)"
        - "class Request: method, path, query: dict[str, str], headers: dict[str, str](小寫鍵), body: bytes"
        - "parse_request(data: bytes) -> Request                      # 畸形 → BadRequest;支援 Content-Length 的 body;query 做 %XX 與 + 解碼"
        - "make_response(status: int, headers: dict, body: bytes) -> bytes   # 自動補 Content-Length 與狀態列"
