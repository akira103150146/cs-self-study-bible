  level: 高中後段/大學
  status: detailed
  summary: "只用 Python 標準函式庫,從 socket 寫起 HTTP 伺服器,加上執行緒池、SQLite 資料層、JSON API 與自己的測試,最後加認證與快取上線。三個技能樹專題是同一份程式碼的三個檢查點;第二個檢查點和組隊副本 R1「圖書館借書 API」同題(另一組隱藏測試)。"
  note: "服務模式:判題時我們的啟動檔以 python3 -I main.py --port 8080 --db /tmp/app.db 呼叫你的服務;測試客戶端用另一個使用者從外面連 8080。檢查點 3(認證、快取)的零件還在 outline,它們的書(G17、G19)還沒寫。"
  acceptance:
    - {id: boss.static-file, name: 靜態檔, visibility: public, checkpoint: proj-be-http-server, consumes: [srv/http, srv/pool], description: "你的伺服器回傳一個靜態檔,狀態碼、Content-Type 與內容都對。"}
    - {id: boss.json, name: JSON 回應, visibility: public, checkpoint: proj-be-http-server, consumes: [srv/http, srv/pool], description: "GET 一個 JSON 端點,回傳的 JSON 與 Content-Type 都對。"}
    - {id: boss.not-found, name: 找不到, visibility: public, checkpoint: proj-be-http-server, consumes: [srv/http], description: "不存在的路徑回 404,伺服器繼續服務。"}
    - {id: boss.bad-request, name: 畸形請求, visibility: public, checkpoint: proj-be-http-server, consumes: [srv/http], description: "畸形的請求回 400,伺服器不能當掉。"}
    - {id: boss.concurrency, name: 100 個併發連線, visibility: hidden, checkpoint: proj-be-http-server, consumes: [srv/http, srv/pool], description: "很多客戶端同時連線也不出錯。", perf: {statement: "100 個連線同時各送 10 個請求(每個請求處理 10 ms),零錯誤,5 秒內", seconds: 5, n: 1000}}
