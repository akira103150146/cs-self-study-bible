    - {id: cp3.deploy, name: 上線, visibility: teacher, checkpoint: proj-be-secure-deploy, consumes: [], description: "Dockerfile／Compose 把服務跑起來(沙盒做不了,老師核可)。"}
  tasks:
    - id: srv/http
      order: 1
      name: HTTP 伺服器
      files: [srv/http.py]
      language: python
      chapter: "25-networking:本章 Lab:HTTP 伺服器 srv/http.py"
      evidenceFor: [be-networking]
      consumes: []
      lab_no: L1
      anchor: lab-srv-http
      used_by: [srv/pool, bookapi/api]
      interface:
        - "class BadRequest(Exception)"
        - "class Request: method, path, query: dict[str, str], headers: dict[str, str](小寫鍵), body: bytes"
        - "parse_request(data: bytes) -> Request                      # 畸形 → BadRequest;支援 Content-Length 的 body;query 做 %XX 與 + 解碼"
        - "make_response(status: int, headers: dict, body: bytes) -> bytes   # 自動補 Content-Length 與狀態列"
        - "serve(port, handler, host='127.0.0.1') -> None              # handler(Request) -> (status, headers, body);單執行緒;判題時 port=8080"
      groups:
        - {id: http.parse, name: 解析請求, kind: function, visibility: public, runner: py-io, requiredBy: [boss.bad-request], description: "parse_request 拆開公開範例的請求:方法、路徑、query、小寫的 header、body。"}
        - {id: http.response, name: 組回應, kind: function, visibility: public, runner: py-io, requiredBy: [boss.static-file, boss.json], description: "make_response 的狀態列、header 與自動補的 Content-Length。"}
        - {id: http.serve, name: 真的連線, kind: function, visibility: public, runner: service, requiredBy: [boss.static-file, boss.json, boss.not-found], description: "從 8080 埠連進來:GET 回 200、handler 回 404 時照樣送出;每個連線處理完就關。"}
        - {id: http.malformed, name: 畸形請求, kind: error, visibility: hidden, runner: py-io, requiredBy: [boss.bad-request], description: "請求列少欄位、header 少冒號、Content-Length 不是數字或是負數、body 比 Content-Length 短,都要 raise BadRequest。"}
        - {id: http.details, name: 規格細節, kind: spec, visibility: hidden, runner: py-io, requiredBy: [boss.bad-request], description: "header 名稱不分大小寫、query 的 %XX 與 + 解碼、沒有 body 的 POST。"}
        - {id: http.half-open, name: 半開與分段, kind: edge, visibility: hidden, runner: service, requiredBy: [boss.bad-request, boss.slow-client], description: "同一個請求分好幾次送到、送一半就斷線、畸形請求回 400 之後,伺服器都要繼續服務。"}
        - id: http.perf
          name: 循序吞吐
          kind: perf
          visibility: hidden
          runner: service
          description: "每個連線處理完就關,不能漏關或卡住。"
          perf: {statement: "單執行緒 serve 連續處理 1,000 個請求(每個一條新連線),2 秒內", seconds: 2, n: 1000}
          perf_ref: "0.47 秒"
          requiredBy: [pool.perf]
    - id: srv/pool
      order: 2
      name: 執行緒池
      files: [srv/pool.py]
      language: python
      chapter: "24-operating-system:本章 Lab:執行緒池 srv/pool.py"
      evidenceFor: [be-os]
      consumes: [srv/http]
      lab_no: L2
      anchor: lab-srv-pool
      also_chapters: [43-parallel]
      used_by: [bookapi/api]
      interface:
        - "class ThreadPool(n)                          # n 個工作執行緒;n < 1 → ValueError"
        - "submit(fn, *args) -> None                    # shutdown 之後 → RuntimeError;工作丟例外時工作執行緒不能死"
        - "shutdown(wait=True) -> None                  # wait=False 立刻回來"
        - "serve_threaded(port, handler, workers=8, timeout=5.0, host='127.0.0.1') -> None   # 用 srv.http 的解析與回應;閒置超過 timeout 秒的連線關掉"
      groups:
        - {id: pool.basic, name: 基本操作, kind: function, visibility: public, runner: py-io, requiredBy: [boss.concurrency], description: "submit 的工作全部跑完;shutdown(wait=True) 等工作做完才回來。"}
