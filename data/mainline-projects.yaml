    - id: libds/graph
      order: 6
      name: 圖與最短路徑
      files: [libds/graph.py]
      language: python
      chapter: "30-graph-algorithms:本章 Lab:圖與最短路徑 libds/graph.py"
      evidenceFor: [t-graph, t-graph-adv]
      consumes: [libds/heap]
      lab_no: L4
      anchor: lab-libds-graph
      used_by: [puzzle/bfs, search/pagerank]
      interface:
        - "class Graph(directed=True)"
        - "add_edge(u, v, w=1) -> None        # 兩端點自動加入;無向圖兩個方向都加;鄰居依加入順序"
        - "bfs(s) -> dict                     # 每個走得到的點 → 最少邊數;s 不在圖上 → KeyError"
        - "dfs_order(s) -> list               # 前序,鄰居依加入順序;不能用遞迴(深度可到 10^5)"
        - "topo_sort() -> list | None         # 同時有好幾個入度 0 的點時先取最小的(用你的 PriorityQueue);有環(自迴圈也算)回傳 None;無向圖 → ValueError"
        - "dijkstra(s) -> (dist, prev)        # dict;dist、prev 只含走得到的點;prev[s] = None;圖上有負權邊 → ValueError;必須用 libds.heap 的 PriorityQueue 與 decrease_key"
        - "shortest_path(s, t) -> (dist, path)   # path 含 s 與 t(任何一條最短的都算);走不到回傳 (None, None)"
      require: [libds.heap]
      forbid: [heapq]
      groups:
        - {id: graph.traverse, name: 走訪, kind: function, visibility: public, requiredBy: [boss.graph], description: "bfs 與 dfs_order 對公開小圖(鄰居依加入順序)。"}
        - {id: graph.topo, name: 拓樸排序, kind: function, visibility: public, requiredBy: [boss.graph], description: "topo_sort 每次取「已經可以排、而且最小」的點(用 libds.heap 的 PriorityQueue);有環回傳 None。"}
        - {id: graph.dijkstra, name: 最短路徑, kind: function, visibility: public, requiredBy: [boss.graph], description: "dijkstra 的距離與 shortest_path 的路徑對公開小圖(任何一條最短路徑都算)。"}
        - {id: graph.edge, name: 邊界, kind: edge, visibility: hidden, requiredBy: [boss.graph], description: "走不到的點、自迴圈(topo_sort 把自迴圈當成環,回傳 None)、重邊、起點等於終點、孤立點、無向圖。"}
        - {id: graph.errors, name: 錯誤處理, kind: error, visibility: hidden, requiredBy: [boss.graph], description: "負權邊要 ValueError;起點不在圖上要 KeyError;無向圖做 topo_sort 要 ValueError。"}
        - {id: graph.deep, name: 很深的圖, kind: edge, visibility: hidden, requiredBy: [boss.graph], description: "10^5 個點連成一條鏈:dfs_order 不能 RecursionError。"}
        - {id: graph.uses-heap, name: 用自己的優先佇列, kind: spec, visibility: hidden, requiredBy: [boss.graph], description: "dijkstra 與 topo_sort 必須用 libds.heap 的 PriorityQueue;dijkstra 要用 decrease_key 更新距離(檢定會檢查呼叫的順序)。"}
        - id: graph.perf
          name: 效能
          kind: perf
          visibility: hidden
          description: "走訪 O(n+m)、Dijkstra O(m log n)。"
          perf: {statement: "n=10^5、m=3×10^5:dijkstra 3 秒內;bfs、dfs_order、topo_sort 各 1 秒內", seconds: 3, n: 100000}
          perf_ref: "dijkstra 0.71 秒(用參考的 libds/heap);bfs／dfs 0.12／0.17 秒"
          requiredBy: [boss.graph, route-planner, puzzle/boss.solve-15]

    - id: libds/dsu
      order: 7
      name: 並查集
      files: [libds/dsu.py]
      language: python
      chapter: "31-greedy:本章 Lab:並查集 libds/dsu.py"
