# 主線專題(任務線)的測試樹 — 書端的唯一來源;9Jang 用 sync:mainlines 匯入
#
# 形狀照 9Jang 的 Zod schema(shared/src/schemas/mainline.schema.ts,以它為準;說明見 data/README.md):
#   version: 1
#   mainlines[]: {id, name, track, lib, project, acceptance[], tasks[]}
#     acceptance[]: {id, name, description, consumes[]}                       ← Boss 戰(驗收檢查)
#     tasks[]: {id, order, name, files[], language, chapter, evidenceFor[], consumes[], groups[]}   ← 任務(元件)
#       groups[]: {id, name, description, visibility, kind, perf?{statement, seconds, n?}, requiredBy[], book?}   ← 任務目標
# 書端多加的欄位(9Jang 不讀,data/README.md 有完整清單):頂層 date、planned_chapters、node_extra、exam_lines;
#   mainline 的 code、also_tracks、checkpoints、level、status、summary、note、future_acceptance(perf.budget)、steps;
#   acceptance 的 visibility、perf、checkpoint;task 的 lab_no、anchor、gap、gap_title、also_chapters、optional、status、
#   used_by、note、interface、internal、forbid、forbid_calls、forbidAttrTypes、require、invariants;group 的 perf_ref、perf_basis、runner。
#
# 對照(老師 2026-10-25):主線專題＝任務線;零件＝任務;測試組＝任務目標;公開＝test／F5;隱藏檢定＝submit;
#   整合測試＝Boss 戰。由上而下:先定 Boss 戰,再拆零件;每組測試寫 requiredBy(是哪個 Boss 或下游測試組需要它)。
#
# 規則:
#   - 任務 id＝元件 id「<零件庫資料夾>/<名>」(資料夾不一定等於 lib,例 bookapi 線的 srv/http);測試組 id「<名>.<組>」,在同一條任務線內不重複。
#   - chapter＝「<章檔名>:<Lab 的 h3 全文>」;h3 一律寫成「本章 Lab:<任務名> <檔案>」,章作者照抄。
#     書裡還沒有章的寫「<缺口編號>:<h3>」(例 G17:…),前半是 G 開頭就代表「還沒有章」。
#   - requiredBy:同任務線的驗收檢查 id、測試組 id 或 future_acceptance 整合題 id;跨任務線寫「<任務線 id>/<id>」(例 puzzle/boss.solve-15)。
#     效能組的 requiredBy 至少要有一個寫了時限的需求(門檻由下游的數字推導),seconds 不能比它寬;
#     整合題的 perf.budget 把總時限拆給各零件的效能組,零件改比它分到的秒數。
#   - used_by 和對方的 consumes 要對稱(書上的「之後會用在」要是真的)。
#   - 效能數字:直覺式純 Python 參考解在 i7-12700KF／Python 3.12 實測(perf_ref,CPU 秒),時限照 9Jang lab:verify 的規則
#     「參考解 CPU ≤ 時限的 1/3」。perf_basis: estimate＝還沒有參考實作可量(H1,等第 10 棒批改器)。
#
# 待決事項的決定(書端先定,9Jang 可推翻):
#   1. 一條任務線對到多個 tree.yaml 專題時(bookapi、各 outline 線),project＝第一個(9Jang 先做的那個檢查點),
#      全部依序列在 checkpoints;後面檢查點的驗收檢查用 checkpoint 欄標記、id 用 cp2.／cp3. 開頭。
#   2. status: outline 的任務線只列任務與 Boss,任務目標(groups)還沒設計;建議 9Jang 的 validateMainlines 對 outline
#      任務線的「project 存在」「驗收檢查有人 requiredBy」「跨線先修閉包」只警告不擋(minidb 的專題 tree.yaml 還沒有)。
#   3. language 用到 Zod 列舉以外的值:asm(Hack、RISC-V 組合語言)、verilog、spice;請 9Jang 的 schema 加進列舉。
#      hack 的晶片寫 hdl(Hack HDL)。
#   4. T1 APCS 只有考試、沒有元件,不算任務線,放在 exam_lines(只給書的路線頁)。
version: 1
date: 2026-10-25

planned_chapters:
  131-security-law-ethics: {gap: G55, title: 動手之前:資安的法律與倫理}
  133-c-deep-dive: {gap: G43, title: C 深入}
  134-chip8-emulator: {gap: G49-1, title: CHIP-8 模擬器}
  135-riscv-assembly: {gap: G32, title: RV32I 組合語言}
  136-verilog: {gap: G34, title: Verilog}
  137-verification-cocotb: {gap: G35, title: cocotb 驗證}

node_extra:
  be-web-basics: [129-http-rest-api]
  be-api: [129-http-rest-api]
  hw-gates: [130-hack-hdl-reference]
  hw-alu: [130-hack-hdl-reference]
  hw-memory: [130-hack-hdl-reference]
  hw-computer: [130-hack-hdl-reference]
  sec-ethics: [131-security-law-ethics]
  ai-numpy: [132-numpy-pandas]
  em-c-pointers: [133-c-deep-dive]
  em-bits-regs: [133-c-deep-dive]
  em-emu-chip8: [134-chip8-emulator]
  hw-riscv-asm: [135-riscv-assembly]
  ic-verilog-basics: [136-verilog]
  ic-comb: [136-verilog]
  ic-testbench: [137-verification-cocotb]
  ic-verification: [137-verification-cocotb]

exam_lines:
  - code: T1
    name: APCS 試煉之路
    track: trunk
    checkpoints: [proj-apcs-trial-p1, proj-apcs-trial-p2, proj-apcs-trial-p3, proj-apcs-trial-p4, proj-apcs-mock-impl, proj-apcs-mock-concept]
    level: 高中
    summary: "考試型專題:每個檢查點是題庫題與考場,不產生零件。照第 8b 棒做完即可。"
    boss:
      - {name: p1 試煉, description: "考場容器抽 4 題過 3 題(條件迴圈、模擬枚舉、位元與進位)。", checkpoint: proj-apcs-trial-p1}
      - {name: p2 試煉, description: "抽 4 過 3(陣列、字串、函式遞迴、排序)。", checkpoint: proj-apcs-trial-p2}
      - {name: p3 試煉, description: "抽 3 過 2(二分搜、前綴和、堆疊佇列、樹、貪心)。", checkpoint: proj-apcs-trial-p3}
      - {name: p4 試煉, description: "抽 2 過 1(圖、動態規劃)。", checkpoint: proj-apcs-trial-p4}
      - {name: 實作模擬考, description: "4 題限時,預估實作級分。", checkpoint: proj-apcs-mock-impl}
      - {name: 觀念模擬考, description: "約 30 題限時,預估觀念級分。", checkpoint: proj-apcs-mock-concept}

mainlines:

# ═════════════════════════════ T2 libds(詳細;9Jang 第一個切片) ═════════════════════════════
- id: libds
  code: T2
  name: libds:自己的資料結構庫
  track: trunk
  also_tracks: [backend, ai]
  lib: libds
  project: proj-trunk-interview
  checkpoints: [proj-trunk-interview]
  level: 高中→大學
  status: detailed
  summary: "一個會長大的 Python 資料結構庫(樹狀陣列與線段樹用 C++)。介面刻意和書上的範例不同:可以參考書,但要自己改寫。後面的圖演算法、解謎 AI、搜尋引擎與借書 API 的快取,都直接 import 你自己的版本。"
  note: "面試 Boss 第一版＝用你現在的 9 個零件重跑每個任務的全部檢定(老師 2026-10-25);整合題列在 future_acceptance,之後再加。"
  acceptance:
    - {id: boss.sort, name: "全套檢定:穩定排序", description: "用你現在的 libds/sort.py 重跑穩定排序任務的全部檢定。", consumes: [libds/sort]}
    - {id: boss.heap, name: "全套檢定:優先佇列", description: "用你現在的 libds/heap.py 重跑優先佇列任務的全部檢定。", consumes: [libds/heap]}
    - {id: boss.lru, name: "全套檢定:LRU 快取", description: "用你現在的 libds/lru.py 重跑 LRU 快取任務的全部檢定。", consumes: [libds/lru]}
    - {id: boss.hashmap, name: "全套檢定:雜湊表", description: "用你現在的 libds/hashmap.py 重跑雜湊表任務的全部檢定。", consumes: [libds/hashmap]}
    - {id: boss.trie, name: "全套檢定:字典樹", description: "用你現在的 libds/trie.py 重跑字典樹任務的全部檢定。", consumes: [libds/trie]}
    - {id: boss.graph, name: "全套檢定:圖與最短路徑", description: "用你現在的 libds/graph.py(與它用到的 heap.py)重跑圖任務的全部檢定。", consumes: [libds/graph, libds/heap]}
    - {id: boss.dsu, name: "全套檢定:並查集", description: "用你現在的 libds/dsu.py(與它用到的 sort.py)重跑並查集任務的全部檢定。", consumes: [libds/dsu, libds/sort]}
    - {id: boss.fenwick, name: "全套檢定:區間加值 BIT", description: "用你現在的 libds/fenwick.hpp 重跑樹狀陣列任務的全部檢定。", consumes: [libds/fenwick]}
    - {id: boss.segtree, name: "全套檢定:區間最小值線段樹", description: "用你現在的 libds/segtree.hpp 重跑線段樹任務的全部檢定。", consumes: [libds/segtree]}
  future_acceptance:   # 之後的整合題(還不是 v1 的 Boss 戰)。perf.budget＝總時限拆給各零件效能組的秒數,零件的門檻由它推導(data/README.md)
    - {id: leaderboard, name: 排行榜, description: "依成績由高到低、同分照報名順序排名,並回答「x 分以上有幾人」。", consumes: [libds/sort]}
    - {id: route-planner, name: 路網導航, description: "n=10^5 個路口、m=3×10^5 條路:一次最短路徑＋10^4 筆路線查詢(用 prev 回溯)。", consumes: [libds/heap, libds/graph], perf: {statement: "dijkstra 一次 3 秒內＋10^4 筆路線查詢 0.5 秒內,合計 3.5 秒", seconds: 3.5, budget: {graph.perf: 3}}}
    - {id: course-scheduler, name: 選課排程, description: "10^5 門課、2×10^5 條先修排出修課順序,有環回報無解,2 秒內。", consumes: [libds/graph, libds/heap]}
    - {id: network-build, name: 佈線預算, description: "10^5 個機房、2×10^5 條線路的最小生成樹。", consumes: [libds/sort, libds/dsu], perf: {statement: "kruskal 2 秒內＋讀入 2×10^5 條線路 0.5 秒內,合計 2.5 秒", seconds: 2.5, budget: {dsu.kruskal-perf: 2}}}
    - {id: search-suggest, name: 搜尋建議, description: "詞頻＋字典樹:10^4 筆前綴查詢各回最常見的 5 個字。", consumes: [libds/hashmap, libds/trie], perf: {statement: "雜湊表數詞頻 2 秒內＋字典樹建樹與 10^4 筆前綴查詢 2.5 秒內＋讀入 0.5 秒內,合計 5 秒", seconds: 5, budget: {hashmap.perf: 2, trie.perf: 2.5}}}
    - {id: cache-replay, name: 快取重播, description: "重播 10^6 筆存取紀錄,回報命中數與淘汰順序。", consumes: [libds/lru], perf: {statement: "10^6 次 get／put 1.5 秒內＋讀紀錄與統計 0.5 秒內,合計 2 秒", seconds: 2, budget: {lru.perf: 1.5}}}
    - {id: range-stats, name: 區間統計, description: "C++:n=q=2×10^5 的區間加值、區間和、區間最小值。", consumes: [libds/fenwick, libds/segtree], perf: {statement: "樹狀陣列 2×10^5 筆操作 1 秒內＋線段樹 2×10^5 筆操作 1 秒內＋讀寫 0.5 秒內,合計 2.5 秒", seconds: 2.5, budget: {fenwick.perf: 1, segtree.perf: 1}}, note: "刻意放寬:原本寫 1 秒,但 9Jang 的效能時限下限是 1 秒(spec §3.3),兩個零件各 1 秒,整合題只好放寬成 2.5 秒。零件的 perf_ref 0.06 秒已含讀寫,這裡的 0.5 秒是整合題自己的輸入與輸出。"}
    - {id: interview-exam, name: 面試考試, description: "考場限時 2 題 TOI 等級實作題(等 BIT／線段樹題庫有了再加)。", consumes: []}
  tasks:
    - id: libds/sort
      order: 1
      name: 穩定排序
      files: [libds/sort.py]
      language: python
      chapter: "28-sorting-searching:本章 Lab:穩定排序 libds/sort.py"
      evidenceFor: [t-sort]
      consumes: []
      lab_no: L1
      anchor: lab-libds-sort
      used_by: [libds/dsu, minidb/btree]
      interface:
        - "stable_sort(a, key=None, reverse=False) -> list   # 穩定;回傳新列表,不改 a;reverse=True 時同 key 仍照原順序"
        - "count_inversions(a) -> int                          # i < j 且 a[i] > a[j] 的對數;用合併排序順便數;不改 a"
        - "bisect_left(a, x, key=None) -> int                  # a 已排序;第一個 key(a[i]) >= x 的位置,沒有就回傳 len(a);key 只套在元素上、不套在 x 上(同 Python 3.10 的 bisect)"
      forbid: [bisect]
      forbid_calls: [sorted, list.sort]
      groups:
        - {id: sort.basic, name: 基本排序, kind: function, visibility: public, requiredBy: [boss.sort], description: "stable_sort 的結果對 sorted();key 與 reverse 的用法同 sorted();回傳新列表、不改原列表。"}
        - {id: sort.inversions, name: 逆序對, kind: function, visibility: public, requiredBy: [boss.sort], description: "count_inversions 對公開範例。"}
        - {id: sort.bisect, name: 二分搜, kind: function, visibility: public, requiredBy: [boss.sort], description: "bisect_left 對公開範例;給了 key 時只套在元素上,x 本身已經是 key 值(同 Python 3.10 的 bisect)。"}
        - {id: sort.edge, name: 邊界, kind: edge, visibility: hidden, requiredBy: [boss.sort], description: "空列表、一個元素、全部相同、已排序、反序;bisect_left 的 x 比全部小或比全部大。"}
        - {id: sort.stable, name: 穩定性, kind: spec, visibility: hidden, requiredBy: [boss.sort, dsu.kruskal], description: "帶標籤的值:同 key 保持原來的順序;reverse=True 時也一樣。"}
        - id: sort.perf
          name: 效能
          kind: perf
          visibility: hidden
          description: "大輸入不能退化成 O(n²);已排序與全部相同的輸入也一樣。"
          perf: {statement: "2×10^5 個整數的 stable_sort 與 count_inversions 各 1.5 秒內;2×10^5 次 bisect_left 1.5 秒內", seconds: 1.5, n: 200000}
          perf_ref: "0.38/0.22/0.24 秒(由下往上的合併排序;計畫原寫 1 秒,參考解超過 1/3,改 1.5 秒)"
          requiredBy: [boss.sort, dsu.kruskal-perf]

    - id: libds/heap
      order: 2
      name: 優先佇列
      files: [libds/heap.py]
      language: python
      chapter: "29-data-structures:本章 Lab:優先佇列 libds/heap.py"
      evidenceFor: [t-adv-ds, t-graph]
      consumes: []
      lab_no: L2
      anchor: lab-libds-heap
      used_by: [libds/graph, puzzle/astar, search/rank]
      interface:
        - "class PriorityQueue(key=None)          # key:比較 priority 時用的函式(預設比 priority 本身);例 key=lambda p: -p 變成最大優先"
        - "push(item, priority) -> None           # item 已經在佇列裡 → ValueError(改用 decrease_key)"
        - "pop_min() -> (item, priority)          # 空的時候 IndexError"
        - "peek_min() -> (item, priority)         # 空的時候 IndexError;不移除"
        - "decrease_key(item, priority) -> None   # O(log n);item 不在 → KeyError;新 priority 比原來大(用 key 比)→ ValueError"
        - "__contains__(item) -> bool;__len__() -> int"
        - "check() -> bool                        # 不變式:堆積性質成立、pos 和 a 一致"
      internal: "self.a:list[(priority, item)],依堆積順序;self.pos:dict item → 在 self.a 的索引(規格規定,隱藏檢定會故意弄壞它們)"
      forbid: [heapq]
      invariants:
        - name: heap.invariant
          kind: function
          symbol: PriorityQueue.check
          sabotage: {attr: [a, pos], breaks: [swap-root-with-leaf, append-smaller-than-parent, corrupt-pos]}
      groups:
        - {id: heap.order, name: 取出順序, kind: function, visibility: public, requiredBy: [boss.heap, graph.topo], description: "push 之後 pop_min／peek_min 依 priority 由小到大;key 參數。"}
        - {id: heap.empty, name: 空的佇列, kind: error, visibility: public, requiredBy: [boss.heap], description: "空的時候 pop_min 與 peek_min 要丟 IndexError。"}
        - {id: heap.ties, name: 相同的 priority, kind: edge, visibility: public, requiredBy: [boss.heap], description: "很多 item 有相同的 priority 時,每個都會被取出一次(同 priority 之間的順序不規定)。"}
        - {id: heap.decrease, name: 降低 priority, kind: function, visibility: public, requiredBy: [boss.heap, graph.dijkstra], description: "decrease_key 之後取出順序正確(用 key(priority) 比);in 與 len 跟著變。"}
        - {id: heap.errors, name: 錯誤處理, kind: error, visibility: hidden, requiredBy: [boss.heap], description: "decrease_key 的 item 不在要丟 KeyError、新 priority 比較大(用 key(priority) 比)要丟 ValueError;push 已經在佇列裡的 item 要丟 ValueError。"}
        - {id: heap.invariant, name: 堆積性質一直成立, kind: invariant, visibility: hidden, requiredBy: [boss.heap], description: "隨機操作的每一步之後 check() 都成立;故意把 self.a 或 self.pos 弄壞時,check() 要抓得到。"}
        - {id: heap.hidden, name: 隨機混合, kind: edge, visibility: hidden, requiredBy: [boss.heap], description: "push、pop_min、decrease_key 隨機交錯,結果對參考模型;一直 push 同一個 priority。"}
        - id: heap.perf
          name: 效能
          kind: perf
          visibility: hidden
          description: "push、pop_min、decrease_key 都要 O(log n)(decrease_key 不能掃整個列表)。"
          perf: {statement: "10^5 次 push＋10^5 次 decrease_key＋10^5 次 pop_min,3 秒內", seconds: 3, n: 100000}
          perf_ref: "0.90 秒(計畫原寫 1 秒;CPython 參考解做不到 1/3,改 3 秒)。graph.perf 的 dijkstra 約做 5×10^5 次堆積操作,用參考堆積 0.71 秒;剛好卡 3 秒的堆積(比參考解慢 3.3 倍)跑同一份 dijkstra 最多約 2.4 秒,仍在 graph.perf 的 3 秒內"
          requiredBy: [boss.heap, graph.perf, puzzle/astar.perf]

    - id: libds/lru
      order: 3
      name: LRU 快取
      files: [libds/lru.py]
      language: python
      chapter: "29-data-structures:本章 Lab:LRU 快取 libds/lru.py"
      evidenceFor: [t-adv-ds]
      consumes: []
      lab_no: L2
      anchor: lab-libds-lru
      used_by: [bookapi/cache]
      interface:
        - "class LRUCache(capacity, on_evict=None)   # capacity < 1 → ValueError;on_evict(key, value) 依淘汰的順序,每淘汰一個呼叫一次"
        - "get(key, default=None)                     # 命中會變成最近使用;沒命中不改順序"
        - "put(key, value) -> key | None              # 回傳被淘汰的 key,沒有淘汰回傳 None;更新既有的 key 不淘汰,但變成最近使用"
        - "resize(capacity) -> None                   # 變小時從最久沒用的開始淘汰(每個都依序呼叫 on_evict);capacity < 1 → ValueError"
        - "keys_by_recency() -> list                  # 由最近使用到最久沒用"
        - "__len__() -> int"
      forbid: [functools, collections.OrderedDict]
      note: "第一版沒有 delete;bookapi/cache(檢查點 3)要讓快取失效時,再決定在 libds/lru 加 pop(key) 或在 bookapi/cache 自己處理。"
      groups:
        - {id: lru.evict, name: 淘汰順序, kind: function, visibility: public, requiredBy: [boss.lru], description: "put 的回傳值與淘汰順序對公開範例;on_evict(key, value) 依淘汰的順序被呼叫。"}
        - {id: lru.update, name: 更新與命中, kind: function, visibility: public, requiredBy: [boss.lru], description: "更新既有的 key 不淘汰但變成最近使用;get 命中也變成最近使用。"}
        - {id: lru.capacity, name: 容量, kind: edge, visibility: hidden, requiredBy: [boss.lru], description: "容量 1;capacity < 1 要 ValueError;resize 變小時從最久沒用的開始淘汰,每個都依序呼叫 on_evict,resize 回傳 None;resize 變大之後不淘汰。"}
        - {id: lru.recency, name: 使用順序, kind: spec, visibility: hidden, requiredBy: [boss.lru, bookapi/cp3.cache-latency], description: "keys_by_recency() 由最近使用到最久沒用;get 沒命中不改順序;put 更新既有的 key 也算使用。"}
        - id: lru.perf
