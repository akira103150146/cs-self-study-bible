- id: hzip
  code: F2
  name: hzip 壓縮器
  track: foundation
  also_tracks: [security]
  lib: hzip
  project: proj-f-prob
  checkpoints: [proj-f-prob]
  level: 高中(L1–L3)/大學
  status: detailed
  summary: "理論任務線:把機率、熵與 GF(2) 多項式寫成會跑的零件,再組成一個會偵測壞檔的壓縮工具。CRC 之後給序列埠訊框與 RISC-V 測試程式用。"
  note: "理論任務線(conventions §8.4):Lab＝讓理論跑起來(蒙地卡羅對公式、Wilson 區間的覆蓋率、Huffman 對熵、CRC 對突發錯誤定理);Boss＝這些理論零件被壓縮器這個工程專題使用。全部是純 Python 標準函式庫,不准用 zlib／gzip／bz2／lzma／zipfile／binascii。命令列零件的檔名是 hzip/cli.py(不是 hzip/hzip.py:套件裡有和套件同名的檔,用 python3 hzip/hzip.py 執行時 import hzip 會找到它自己),執行方式 python3 -m hzip.cli。考卷(tree.yaml proj-f-prob 的 verify 前半)是 boss.exam,v1 老師核可。效能數字:i7-12700KF／Python 3.12 的 CPU 秒(perf_ref)。"
  acceptance:
    - {id: boss.roundtrip, name: 二進位檔往返, consumes: [hzip/cli, hzip/huffman, hzip/lz77, hzip/crc, hzip/stats], description: "隱藏的檔案(空檔、1 個位元組、同一個位元組重複、英文、程式碼、中文 UTF-8、執行檔、隨機、已壓縮過,最大 1 MiB)用 python3 -m hzip.cli 壓縮再解壓,要一模一樣。", perf: {statement: "256 KiB 的檔壓縮＋解壓(兩次執行)合計 2.5 秒內", seconds: 2.5, n: 262144}}
    - {id: boss.corrupt, name: 壞檔偵測, consumes: [hzip/cli, hzip/crc], description: "把你壓出來的檔改壞:翻任何一個位元、隨機改壞連續 4 個位元組以內的一段、截斷、多接位元組,以及 CRC 都對但內容不合規格的檔,解壓一律回報壞檔(結束碼 1、不留下輸出檔),不能當掉或丟別的例外。"}
    - {id: boss.ratio, name: 壓縮率, consumes: [hzip/cli, hzip/lz77, hzip/huffman], description: "隱藏語料(英文、程式碼、中文、執行檔)壓縮後的大小 ≤ 參考 hzip 的 1.10 倍＋32 位元組;不可壓縮的資料最多比原檔多 18 個位元組(只有標頭與 CRC)。"}
    - {id: boss.interop, name: 格式相容, consumes: [hzip/cli], description: "你的 hzip 解得開參考 hzip 用三種方法壓的檔;參考 hzip 也解得開你壓的檔(canonical Huffman 只存碼長,兩邊重建出來的碼一定一樣)。"}
    - {id: boss.prob-final, name: "機率期末:理論對實測", consumes: [hzip/stats, hzip/huffman, hzip/crc], description: "用你的 mc_estimate 跑 2×10^5 次「把一個 16 位元組＋CRC-8 的訊框隨機改壞」,漏抓率的 95% 信賴區間要罩住理論值 (2^128−1)/(2^136−1) ≈ 1/256(seed 固定);訊框上(位元組的高位先)長度 ≤ 8 位元的突發錯誤一次都不能漏;Huffman 的平均碼長 L 對隱藏分布滿足 H ≤ L < H+1(H 用你的 FreqTable.entropy() 算)。"}
    - {id: boss.exam, name: 機率統計考卷, visibility: teacher, consumes: [], description: "英文參數化考卷:條件機率、貝氏、期望值、CLT 近似、熵與 Huffman 碼長(tree.yaml proj-f-prob 的 verify 前半)。由手算卡的考場出題,不判零件;v1 老師核可,9Jang 有考卷型 Boss 之後改成自動。"}
  tasks:
    - id: hzip/stats
      order: 1
      name: 頻率與估計
      files: [hzip/stats.py]
      language: python
      chapter: "14-combinatorics-probability:本章 Lab:頻率與估計 hzip/stats.py"
      evidenceFor: [f-prob]
      consumes: []
      lab_no: L1
      anchor: lab-hzip-stats
      also_chapters: [57-probability]
      used_by: [hzip/huffman, hzip/cli]
      note: "和書上範例不同:14-combinatorics-probability 的 simulate_sum_seven(trials) 用全域 random、只回傳一個比例;57-probability 的信賴區間是 Wald 的 p̂ ± 1.96√(p̂(1−p̂)/n)。Lab 要頻率表類別、可插入的試驗函式與傳進來的 rng(不准用全域 random)、Wilson 分數區間(k=0 時 Wald 的區間寬度是 0,覆蓋率檢定會抓到)。(ctf/crack 的卡方評分自己寫一份,不用這個零件。)"
      interface:
        - "class FreqTable(data=())                # data:可迭代的符號(bytes → 0..255 的整數、str → 字元)"
        - "add(sym, k=1) -> None;update(data) -> None   # k < 0 → ValueError;k = 0 什麼都不改"
        - "count(sym) -> int;prob(sym) -> float    # 沒出現過 → 0;空表的 prob → ValueError"
        - "total(屬性,次數總和);__len__()＝不同符號的個數;__contains__(sym)"
        - "items() -> list[(sym, count)]           # 依符號排序"
        - "most_common(k=None) -> list[(sym, count)]   # 次數多到少、同次數依符號;k=None 全部"
        - "entropy() -> float                      # 位元/符號;空表或只有一種符號 → 0.0"
        - "check() -> bool                         # 不變式:total ＝ 次數和、每個次數 ≥ 1"
        - "proportion_ci(k, n, conf=0.95) -> (lo, hi)   # Wilson 分數區間,z＝NormalDist().inv_cdf((1+conf)/2),結果夾在 [0, 1];n < 1、k 不在 0..n、conf 不在 (0, 1) → ValueError"
        - "mc_estimate(trial, n, rng, conf=0.95) -> (p_hat, (lo, hi))   # trial(rng) -> bool 恰好呼叫 n 次;只用傳進來的 rng(random.Random);區間用 proportion_ci;n < 1 → ValueError"
        - "mc_mean(sample, n, rng, conf=0.95) -> (mean, (lo, hi))       # sample(rng) -> float;mean ± z·s/√n(s 用 n−1);n < 2 → ValueError"
      internal: "self.counts:dict 符號 → 次數(每個 ≥ 1);self.total:次數總和(規格規定,隱藏檢定會故意弄壞它們)"
      forbid: [zlib, gzip, bz2, lzma, zipfile, binascii]
      invariants:
        - name: stats.invariant
          kind: function
          symbol: FreqTable.check
          sabotage: {attr: [counts, total], breaks: [total-off-by-one, zero-count-entry, negative-count]}
      groups:
        - {id: stats.freq, name: 頻率表, kind: function, visibility: public, requiredBy: [huffman.entropy-bound, cli.roundtrip], description: "FreqTable 的 count、total、len、prob、items、most_common 對公開範例(bytes 與 str 都要)。"}
        - {id: stats.entropy, name: 熵, kind: function, visibility: public, requiredBy: [huffman.entropy-bound, boss.prob-final], description: "entropy() 對公式 −Σ p·log₂p,誤差 1e-9 內;只有一種符號或空表是 0.0。"}
        - {id: stats.ci, name: Wilson 區間, kind: function, visibility: public, requiredBy: [boss.prob-final], description: "proportion_ci 對公開範例(誤差 1e-9 內);k = 0 時下界是 0、上界大於 0。"}
        - {id: stats.mc, name: 蒙地卡羅, kind: function, visibility: public, requiredBy: [boss.prob-final], description: "mc_estimate 恰好呼叫 trial n 次、p_hat ＝ 成功數 / n、區間＝proportion_ci;mc_mean 的平均與區間對公開範例。"}
        - {id: stats.tolerance, name: 估計落在誤差內, kind: spec, visibility: hidden, requiredBy: [boss.prob-final], description: "已知答案的問題(兩顆骰子和為 7、四分之一圓估 π/4、生日問題、幾何分布的平均)用固定 seed 估計:|估計 − 理論| ≤ 4 個標準誤。"}
        - {id: stats.coverage, name: 區間真的罩得住, kind: spec, visibility: hidden, requiredBy: [boss.prob-final], description: "proportion_ci 在格點 n ∈ {20, 50, 100, 500} × p ∈ {0.002, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.3, 0.5} 上,用二項分布精確算覆蓋率:每一格 ≥ 0.90、平均 ≥ 0.94,每一格的平均寬度 ≤ 參考的 1.25 倍(Wald 在 n=20、p=0.002 只有 4%);mc_mean 重複 1000 次的覆蓋率在 0.92–0.975 之間。"}
        - {id: stats.rng, name: 只用傳進來的 rng, kind: spec, visibility: hidden, requiredBy: [boss.prob-final], description: "同一個 seed 跑兩次結果一樣;兩次之間把全域 random 重設成別的 seed,結果也不變。"}
        - {id: stats.edge, name: 邊界, kind: edge, visibility: hidden, requiredBy: [boss.prob-final], description: "空表、add k=0、k=n 與 k=0 的區間、n=1、conf=0.99;錯誤:k < 0、k > n、n < 1、conf 不在 (0, 1)、mc_mean 的 n < 2,都要 ValueError。"}
        - {id: stats.invariant, name: 頻率表的不變式一直成立, kind: invariant, visibility: hidden, requiredBy: [boss.prob-final], description: "隨機 add／update 的每一步之後 check() 都成立;故意把 total 改錯、塞進次數 0 或負數的符號時,check() 要抓得到。"}
        - id: stats.perf
          name: 效能
          kind: perf
          visibility: hidden
          description: "FreqTable 每個符號 O(1);mc_estimate 本身不能比試驗慢很多。"
          perf: {statement: "FreqTable(4 MiB 的 bytes)1 秒內;mc_estimate 跑 10^6 次(試驗本身很快)1 秒內", seconds: 1, n: 4194304}
          perf_ref: "FreqTable 4 MiB 0.17 秒;mc_estimate 10^6 次 0.05 秒"
          requiredBy: [cli.perf, boss.prob-final]

    - id: hzip/huffman
      order: 2
      name: Huffman 編碼
      files: [hzip/huffman.py]
      language: python
      chapter: "108-information-theory:本章 Lab:Huffman 編碼 hzip/huffman.py"
      evidenceFor: [f-info-theory]
      consumes: [hzip/stats]
      lab_no: L2
      anchor: lab-hzip-huffman
      also_chapters: [31-greedy]
      used_by: [hzip/cli]
      note: "和書上範例不同:31-greedy 的 build_huffman(freqs) 建樹後回傳 '0'/'1' 字串的碼;108-information-theory 的 entropy(probs) 吃機率列表。Lab 只算碼長,再用 canonical 規則(DEFLATE 的做法)配碼、真的打包成位元組、只靠碼長就能解碼,並用 Fraction 精確檢查 Kraft 等式;碼長表吃 hzip.stats 的 FreqTable。"
      interface:
        - "code_lengths(freq) -> dict             # freq:hzip.stats.FreqTable(或 items() 回傳 (符號, 次數) 的物件);次數 0 的不給碼;只有一種符號 → {s: 1};沒有符號 → {}"
        - "kraft_sum(lengths) -> Fraction         # Σ 2^-L,用 fractions.Fraction 精確算"
        - "canonical_codes(lengths) -> dict       # 符號 → (code, length);依 (長度, 符號) 排序後連續配碼(DEFLATE 的規則);長度 < 1 或 kraft_sum > 1 → ValueError"
        - "encode(symbols, lengths) -> (bytes, nbits)   # 用 canonical_codes 的碼;位元由高到低填進位元組,最後一個位元組補 0;符號不在 lengths → KeyError"
        - "decode(payload, nbits, lengths) -> list      # 只靠 lengths 重建碼;nbits 超過 payload、碰到不存在的碼、最後剩半個碼 → ValueError"
      forbid: [zlib, gzip, bz2, lzma, zipfile]
      groups:
        - {id: huffman.optimal, name: 總位元數最少, kind: function, visibility: public, requiredBy: [boss.ratio, boss.prob-final], description: "Σ 次數 × 碼長 等於最佳值(同次數時的取法不規定,只比總和)。"}
        - {id: huffman.kraft, name: Kraft 等式, kind: function, visibility: public, requiredBy: [boss.prob-final], description: "兩種以上的符號時 kraft_sum(code_lengths(…)) 剛好是 1(Huffman 樹是滿二元樹);只有一種符號時是 1/2。"}
        - {id: huffman.canonical, name: canonical 碼, kind: spec, visibility: public, requiredBy: [boss.interop], description: "canonical_codes 對公開範例逐一相同:依 (長度, 符號) 排序,同長度連續加 1,換長度時左移。"}
        - {id: huffman.roundtrip, name: 往返一致, kind: function, visibility: public, requiredBy: [boss.roundtrip], description: "decode(*encode(x, L), L) == x;nbits 等於每個符號碼長的和。"}
        - {id: huffman.prefix, name: 前綴碼, kind: spec, visibility: hidden, requiredBy: [boss.roundtrip, boss.interop], description: "隨機的碼長表(合法的)配出來的碼沒有一個是另一個的前綴;位元的順序是由高到低。"}
        - {id: huffman.entropy-bound, name: 對得上熵, kind: spec, visibility: hidden, requiredBy: [boss.prob-final, boss.ratio], description: "隱藏的隨機分布(至少兩種符號):平均碼長 L 滿足 H ≤ L < H+1,H 是你的 FreqTable.entropy()。"}
        - {id: huffman.edge, name: 邊界, kind: edge, visibility: hidden, requiredBy: [boss.roundtrip], description: "空輸入、只有一種符號、兩種符號、256 種一樣多(全部 8 位元)、費氏數列的次數(碼長到 255)、次數很大的整數。"}
        - {id: huffman.errors, name: 錯誤處理, kind: error, visibility: hidden, requiredBy: [boss.corrupt], description: "Kraft 和 > 1 或長度 < 1 的碼長表要 ValueError;decode 的位元不夠、碰到不存在的碼、最後剩半個碼要 ValueError;encode 不認得的符號要 KeyError。"}
        - id: huffman.perf
          name: 效能
          kind: perf
          visibility: hidden
          description: "建碼 O(k log k)、編碼與解碼每個位元 O(1)(不能每個位元都掃一遍碼表)。"
          perf: {statement: "256 KiB 的資料 code_lengths＋encode＋decode 合計 1 秒內", seconds: 1, n: 262144}
          perf_ref: "最差 0.21 秒(256 KiB 的執行檔片段;逐位元解碼＋每個長度的起始碼表)"
          requiredBy: [cli.perf]

    - id: hzip/lz77
      order: 3
      name: LZ77
      files: [hzip/lz77.py]
      language: python
      chapter: "108-information-theory:本章 Lab:LZ77 hzip/lz77.py"
      evidenceFor: [f-info-theory]
      consumes: []
      lab_no: L3
      anchor: lab-hzip-lz77
      used_by: [hzip/cli]
      note: "和書上範例不同:108-information-theory 的 lz77_encode(data, window=8, lookahead=4) 處理 str、每個位置掃整個視窗、最後一個三元組的 next 是 ''、沒有解碼器。Lab 處理 bytes、視窗 4096／預視 255、next 一定是位元組(最後一段匹配要留一個位元組)、要解碼(含重疊複製)與 4 位元組打包,效能門檻逼你用雜湊索引找候選。"
      interface:
        - "encode(data, window=4096, lookahead=255) -> list[(offset, length, next)]   # data:bytes;next 是 0..255 的整數,每個三元組都有(最後一段匹配要留一個位元組當 next);length = 0 時 offset = 0;1 ≤ offset ≤ window、length ≤ lookahead;1 ≤ window ≤ 65535、1 ≤ lookahead ≤ 255,否則 ValueError"
        - "decode(tokens) -> bytes                 # 支援 offset < length 的重疊複製;offset 超過已輸出的長度、length > 0 但 offset = 0、length = 0 但 offset ≠ 0 → ValueError"
        - "pack(tokens) -> bytes                   # 每個三元組 4 個位元組:offset(2,大端)、length、next"
        - "unpack(blob) -> list                    # 長度不是 4 的倍數 → ValueError"
      forbid: [zlib, gzip, bz2, lzma, zipfile]
      groups:
        - {id: lz77.roundtrip, name: 往返一致, kind: function, visibility: public, requiredBy: [boss.roundtrip], description: "decode(encode(x)) == x;三元組都合規格(offset、length 的範圍,next 一定是位元組)。"}
        - {id: lz77.decode, name: 解碼與重疊複製, kind: function, visibility: public, requiredBy: [boss.interop], description: "decode 對公開的三元組逐一相同,包括 offset < length 的重疊複製(例如 (1, 5, …) 把同一個位元組重複)。"}
        - {id: lz77.pack, name: 打包, kind: spec, visibility: public, requiredBy: [boss.interop], description: "pack／unpack 對公開範例的位元組逐一相同(offset 2 個位元組大端、length、next)。"}
        - {id: lz77.edge, name: 邊界, kind: edge, visibility: hidden, requiredBy: [boss.roundtrip], description: "空資料、1 個位元組、同一個位元組重複 10^5 次、window = 1、lookahead = 1、長度剛好 lookahead+1、匹配剛好在視窗最遠的位置;offset 不超過 window、length 不超過 lookahead。"}
        - {id: lz77.errors, name: 錯誤處理, kind: error, visibility: hidden, requiredBy: [boss.corrupt], description: "window、lookahead 超出範圍要 ValueError;decode 的 offset 超過已輸出的長度、length > 0 但 offset = 0、length = 0 但 offset ≠ 0 要 ValueError;unpack 的長度不是 4 的倍數要 ValueError。"}
        - {id: lz77.ratio, name: 壓縮率, kind: spec, visibility: hidden, requiredBy: [boss.ratio], description: "隱藏語料(英文、程式碼、中文、執行檔)的三元組個數 ≤「在視窗裡每次取最長匹配(長度 1、2 也算)」的 1.10 倍。"}
        - id: lz77.perf
          name: 效能
          kind: perf
          visibility: hidden
          description: "用雜湊表(例如前 3 個位元組 → 位置鏈)找候選,不能每個位置掃整個 4096 的視窗。"
          perf: {statement: "256 KiB 的資料 encode＋decode 合計 1.5 秒內(window=4096、lookahead=255)", seconds: 1.5, n: 262144}
          perf_ref: "最差 0.36 秒(256 KiB 執行檔片段;3 位元組雜湊鏈最多看 64 個候選,找不到再看最近的 2、1 位元組);每個位置掃整個視窗的版本在英文 32 KiB 就要 1 秒"
          requiredBy: [cli.perf]

    - id: hzip/crc
      order: 4
      name: CRC
      files: [hzip/crc.py]
      language: python
      chapter: "15-number-theory-graphs:本章 Lab:CRC hzip/crc.py"
      evidenceFor: [f-discrete]
      consumes: []
      lab_no: L4
      anchor: lab-hzip-crc
      gap: G13
      gap_title: GF(2) 與 CRC
      used_by: [hzip/cli, fw/uart, rtl/cpu]
      note: "和書上範例不同:G13 小節的範例是逐位元的 GF(2) 長除法(不反射、init 0)。Lab 要可設定的 Rocksoft 參數(width、poly、init、refin、refout、xorout,含 width < 8 與 refin ≠ refout)、256 格查表、和 zlib.crc32 完全相同(含接續計算),效能門檻讓逐位元版超時(約 8 倍慢)。CRC8＝CRC-8/SMBUS 是書端決定給 fw/uart 訊框用的;fw 任務線要別的參數可以自己建 CRC(…)。"
      interface:
        - "gf2_mul(a, b) -> int                   # GF(2) 多項式乘法(位元 i ＝ x^i 的係數)"
        - "gf2_divmod(a, b) -> (q, r)             # a ＝ q·b ⊕ r,deg r < deg b;b = 0 → ZeroDivisionError"
        - "class CRC(width, poly, init=0, refin=False, refout=False, xorout=0)   # Rocksoft 參數模型;width 不在 1..64、poly／init／xorout 不在 [0, 2^width) → ValueError"
        - "CRC.compute(data) -> int               # 查表法(256 格),data 是 bytes"
        - "crc32(data, value=0) -> int            # 和 zlib.crc32 一樣,包括 crc32(b, crc32(a)) == crc32(a + b)"
        - "CRC8 = CRC(8, 0x07)                    # CRC-8/SMBUS,check 值(b'123456789')0xF4,給 fw/uart 的訊框"
        - "CRC16 = CRC(16, 0x1021, init=0xFFFF)   # CRC-16/IBM-3740(俗稱 CCITT-FALSE),check 值 0x29B1"
      forbid: [zlib, binascii, gzip, bz2, lzma, zipfile]
      groups:
        - {id: crc.zlib, name: 和 zlib 一樣, kind: function, visibility: public, requiredBy: [boss.corrupt, boss.interop, rtl/cp2.riscv-tests], description: "crc32 對 zlib.crc32(公開範例:空資料、b'123456789' → 0xCBF43926、接續計算)。"}
        - {id: crc.params, name: 可設定的 CRC, kind: function, visibility: public, requiredBy: [boss.prob-final, fw/cp3.uart-console], description: "CRC8、CRC16 與公開的幾組參數算 b'123456789' 的 check 值對 CRC 目錄。"}
        - {id: crc.gf2, name: GF(2) 多項式, kind: function, visibility: public, requiredBy: [boss.prob-final], description: "gf2_mul、gf2_divmod 對公開範例;q·b ⊕ r ＝ a 而且 deg r < deg b。"}
        - {id: crc.catalogue, name: CRC 目錄, kind: spec, visibility: hidden, requiredBy: [fw/cp3.uart-console, boss.corrupt], description: "隱藏的 CRC 目錄參數(width 3 到 64、反射與不反射、refin ≠ refout、init 與 xorout 不是 0)的 check 值,以及隨機資料對參考模型。"}
        - {id: crc.theory, name: 理論性質, kind: spec, visibility: hidden, requiredBy: [boss.corrupt, boss.prob-final], description: "init = 0、不反射、xorout = 0 時,CRC 等於 gf2_divmod(M(x)·x^w, G(x)) 的餘式;同長度的資料 crc(a ⊕ b) = crc(a) ⊕ crc(b);資料裡長度 ≤ width 的突發錯誤一定讓 CRC 改變(照 CRC 自己的位元順序:refin=False 是每個位元組的高位先、refin=True 是低位先;短資料窮舉)。"}
        - {id: crc.errors, name: 錯誤處理, kind: error, visibility: hidden, requiredBy: [boss.corrupt], description: "width 不在 1..64、poly／init／xorout 超出範圍要 ValueError;gf2_divmod 除以 0 要 ZeroDivisionError。"}
        - id: crc.perf
          name: 效能
          kind: perf
          visibility: hidden
          description: "查表法每個位元組 O(1);逐位元的長除法會超時。"
          perf: {statement: "4 MiB 的 crc32 1 秒內;CRC8、CRC16 各 1 MiB 1 秒內", seconds: 1, n: 4194304}
          perf_ref: "crc32 4 MiB 0.24 秒;CRC8／CRC16 1 MiB 0.04／0.06 秒;逐位元版約 8 倍慢(4 MiB 約 1.9 秒,由 128 KiB 實測推算)"
          requiredBy: [cli.perf]

    - id: hzip/cli
      order: 5
      name: 檔案格式與命令列
      files: [hzip/cli.py]
      language: python
      chapter: "15-number-theory-graphs:本章 Lab:檔案格式與命令列 hzip/cli.py"
      evidenceFor: [f-info-theory]
      consumes: [hzip/stats, hzip/huffman, hzip/lz77, hzip/crc]
      lab_no: L5
      anchor: lab-hzip-cli
      gap: G13
      gap_title: GF(2) 與 CRC
      used_by: [boss.roundtrip, boss.corrupt, boss.ratio, boss.interop]
      note: "書上沒有對應的範例(新零件)。格式是規格的一部分(boss.interop 用參考 hzip 互解),所以 internal 寫死了位元組配置。"
      interface:
        - "class CorruptError(ValueError)"
        - "compress(data, method=None) -> bytes    # method:None 自動選最小(一樣大選編號小的)、0 原樣、1 Huffman、2 LZ77＋Huffman;指定 method 時空資料也要能壓"
        - "decompress(blob) -> bytes               # 先驗整個容器的 CRC-32,再解碼,最後驗原始長度與原始資料的 CRC-32;任何不對 → CorruptError(不能丟別的例外)"
        - "main(argv) -> int                       # c IN OUT/d IN OUT/t IN;0 成功、1 壞檔(stderr 印一行、不留下 OUT)、2 用法或檔案錯誤;執行:python3 -m hzip.cli c IN OUT"
      internal: "hzip v1 格式(整數一律大端):magic b'HZIP'(4)、version＝1(1)、method(1)、原始長度(4)、原始資料的 crc32(4)、body、最後 4 個位元組＝前面全部的 crc32。body:method 0＝原始資料;method 1＝256 個位元組的碼長表(位元組值 b 的碼長,0＝沒用到)＋nbits(4)＋Huffman 位元流(剛好 ceil(nbits/8) 個位元組,用 hzip.huffman 的 canonical 碼);method 2＝lz77.pack(lz77.encode(data)) 的結果再照 method 1 壓。method 0 的額外負擔剛好 18 個位元組。頻率一律用 hzip.stats.FreqTable 數。"
      forbid: [zlib, gzip, bz2, lzma, zipfile, binascii]
      require: [hzip.stats, hzip.huffman, hzip.lz77, hzip.crc]
      groups:
        - {id: cli.roundtrip, name: 往返一致, kind: function, visibility: public, requiredBy: [boss.roundtrip], description: "公開範例(空資料、b'a'、英文、隨機位元組)三種 method 與自動選擇都 decompress(compress(x)) == x。"}
        - {id: cli.format, name: 標頭與 CRC, kind: spec, visibility: public, requiredBy: [boss.interop, boss.corrupt], description: "magic、version、method、原始長度、原始 crc32 與最後的容器 crc32 都在規定的位置;compress(b'', 0) 與 compress(x, 0) 的位元組對公開範例逐一相同。"}
        - {id: cli.command, name: 命令列, kind: function, visibility: public, requiredBy: [boss.roundtrip], description: "main(['c', IN, OUT])、['d', …]、['t', IN] 的結束碼與輸出檔;參數不對回傳 2。"}
        - {id: cli.edge, name: 邊界, kind: edge, visibility: hidden, requiredBy: [boss.roundtrip], description: "空檔、1 個位元組、同一個位元組重複、256 種位元組各一次、1 MiB 的檔;只有一種位元組時指定 method 1。"}
        - {id: cli.corrupt, name: 改壞的檔, kind: error, visibility: hidden, requiredBy: [boss.corrupt], description: "翻任何一個位元(每個位元都試)、隨機改壞連續 4 個位元組以內的一段、截斷到任何長度、後面多接位元組,decompress 都要 CorruptError;main 回傳 1 而且不留下 OUT。"}
        - {id: cli.malformed, name: CRC 對但內容壞, kind: error, visibility: hidden, requiredBy: [boss.corrupt], description: "容器 CRC 正確但 method 不認得、碼長表超額、nbits 和長度對不上、LZ77 的 offset 超出、原始長度或原始 CRC 不對,都要 CorruptError,不能丟 IndexError 之類的例外。"}
        - {id: cli.interop, name: 和參考 hzip 互解, kind: spec, visibility: hidden, requiredBy: [boss.interop], description: "參考 hzip 用 method 0、1、2 壓的檔你都解得開;你壓的檔參考 hzip 也解得開。"}
        - {id: cli.stored, name: 不會越壓越大, kind: spec, visibility: hidden, requiredBy: [boss.ratio], description: "隨機與已經壓縮過的資料自動選擇時,輸出 ≤ 原長＋18 個位元組。"}
        - id: cli.perf
          name: 效能
          kind: perf
          visibility: hidden
          description: "壓縮會試 method 1 與 2;每個零件都要夠快。"
          perf: {statement: "256 KiB 的檔 compress＋decompress 合計 2.5 秒內", seconds: 2.5, n: 262144}
          perf_ref: "最差 0.58 秒(行程內,256 KiB 執行檔片段);python3 -m hzip.cli 兩次執行含啟動約 0.66 秒"
          requiredBy: [boss.roundtrip]

