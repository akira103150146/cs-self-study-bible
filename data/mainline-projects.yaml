    - {id: cp2.public, name: 公開 API 測試, visibility: public, checkpoint: proj-be-todo-api, consumes: [bookapi/repo, bookapi/api], description: "約 12 條公開測試:書目 CRUD、會員、借書、還書、逾期查詢的正常流程。"}
    - {id: cp2.edge, name: 邊界, visibility: hidden, checkpoint: proj-be-todo-api, consumes: [bookapi/repo, bookapi/api], description: "隱藏測試類別「邊界」:分頁的極端值、空字串、本數 0 的書、Unicode 書名。"}
