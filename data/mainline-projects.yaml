        - {id: assembler.symbols, name: 符號與格式, kind: edge, visibility: hidden, requiredBy: [boss.rain], description: "標籤先用後定義、變數從 RAM[16] 依第一次出現的順序配置、預先定義的符號(SP、LCL、ARG、THIS、THAT、R0–R15、SCREEN、KBD)、行尾註解、空白與空行、@32767。"}
        - {id: assembler.symfile, name: 符號表檔, kind: function, visibility: public, requiredBy: [boss.own-program], description: "--symbols 寫出 Prog.sym:先列標籤「label 名稱 ROM 位址」(依原始碼順序),再列變數「var 名稱 RAM 位址」(依配置順序),不列預先定義的符號;沒給 --symbols 就不寫。"}
        - {id: assembler.errors, name: 錯誤回報, kind: error, visibility: hidden, requiredBy: [boss.own-program], description: "不認得的 comp、dest、jump,@ 後面的數字超過 32767 或不是合法的符號,標籤和前面的標籤或預先定義的符號同名,括號沒有關:只報行號最小的那個錯誤,stderr 印「檔名:行號:」開頭的一行(原始檔的行號),結束狀態碼 1,不寫出 .hack 與 .sym。"}
        - {id: assembler.runs, name: 組出來的程式會動, kind: spec, visibility: hidden, requiredBy: [boss.rain], description: "5 支隱藏 .asm 組完再丟給 CPU 模擬器跑,結果要對。"}
        - id: assembler.perf
          name: 效能
          kind: perf
          visibility: hidden
          description: "兩趟掃描,符號表查詢 O(1)。"
          perf: {statement: "3×10^4 行的 .asm,2 秒內組完", seconds: 2, n: 30000}
          perf_ref: "0.02 秒(簡單參考解)"
          requiredBy: [boss.rain]

