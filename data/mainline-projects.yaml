          perf_ref: "1.70 秒"
          requiredBy: [boss.baseline]

    - id: nn/optim
      order: 4
      name: 最佳化器
      files: [nn/optim.py]
      language: python
      chapter: "109-optimization:本章 Lab:最佳化器 nn/optim.py"
      evidenceFor: [ai-optim]
      consumes: []
      lab_no: L4
      anchor: lab-nn-optim
      used_by: [nn/mlp]
      note: "自己寫,不包 numkit/optim:大綱原本寫 consumes numkit/optim,但 numkit/optim 的節點 f-optim 不在 ai-optim 的先修閉包裡(ai-optim 的先修只有 f-calc-1、f-linalg),而且 numkit 還是 outline。和第 109 章的差別:書的動量是指數平均形式 v ← βv + (1−β)∇f、x ← x − αv;Lab 照 PyTorch 的慣例 v ← μv + g、data ← data − lr·v(數值不同,第一步就看得出來);書上的 Adam 只有文字,Lab 規定偏差修正的完整公式;另外多 weight_decay、clip_grad_norm、zero_grad 與錯誤處理,而且更新的是有 .data／.grad 的參數物件,不是 numpy 陣列。不 consumes nn/value(2026-10-26 修正死結:nn/value 的節點 ai-mlp 要等 ai-optim 完成才解鎖,而 ai-optim 的 Lab 就是這個任務):公開範例與隱藏檢定都用判題端一個只有 .data、.grad 的 Param 類別,梯度由測試自己算;nn/mlp 才把你的 Value 交給這裡的最佳化器。手算(109,數值答案):兩步動量、一步 Adam(第一步每個參數大約移動 lr·sign(g))。反例題建議:「學習率越大收斂越快」(f = x² 時 lr > 1 就發散)。"
      interface:
        - "class SGD(params, lr, momentum=0.0, weight_decay=0.0)   # params:有 .data 與 .grad(float)的物件(判題用只有這兩個屬性的 Param;之後 nn/mlp 傳進來的是你的 Value);每步 g = grad + weight_decay·data,v = momentum·v + g,data -= lr·v(v 從 0 開始;momentum=0 就是 data -= lr·g)"
        - "class Adam(params, lr=0.001, betas=(0.9, 0.999), eps=1e-8, weight_decay=0.0)   # g 同上;m = β₁m + (1−β₁)g、v = β₂v + (1−β₂)g²;m̂ = m/(1−β₁ᵗ)、v̂ = v/(1−β₂ᵗ);data -= lr·m̂/(√v̂ + eps);t 是 step 的次數(從 1 起)"
        - "step() -> None;zero_grad() -> None              # zero_grad 把每個參數的 grad 設成 0.0;step 不會自己清梯度"
        - "clip_grad_norm(params, max_norm) -> float        # 回傳剪裁前所有 grad 的整體 L2 範數;超過 max_norm 就把每個 grad 乘上 max_norm/範數"
        - "錯誤:params 是空的或同一個物件出現兩次、lr ≤ 0、momentum 不在 [0, 1)、betas 不在 [0, 1)、weight_decay < 0、max_norm ≤ 0 → ValueError"
      forbid: [numpy, torch]
      groups:
        - {id: optim.sgd, name: SGD 與動量, kind: function, visibility: public, requiredBy: [mlp.train], description: "給定梯度,SGD(有沒有動量、weight_decay)幾步之後的值對公式(1e-12 內)。"}
        - {id: optim.adam, name: Adam, kind: function, visibility: public, requiredBy: [mlp.train, boss.mnist], description: "給定梯度,Adam 前三步的值對公式,包括偏差修正。"}
        - {id: optim.clip, name: 梯度剪裁, kind: function, visibility: public, requiredBy: [mlp.train], description: "clip_grad_norm 的回傳值與剪裁後的梯度;zero_grad 之後都是 0。"}
        - {id: optim.converge, name: 收斂到最小值, kind: function, visibility: hidden, requiredBy: [mlp.train], description: "判題端的 Param 與測試自己算的梯度:Adam 把 Rosenbrock 函數從 (−1.5, 2) 收斂到 (1, 1) 附近(誤差 1e-3 內、5,000 步內);SGD＋動量收斂到隱藏的病態二次函數的最小值。"}
        - {id: optim.state, name: 每個參數各自的狀態, kind: spec, visibility: hidden, requiredBy: [mlp.train], description: "每個參數有自己的 m、v、動量;梯度是 0 的參數 Adam 的 t 照樣加;weight_decay 加在梯度上(不是 AdamW);兩個最佳化器互不影響;沒 zero_grad 時梯度照樣累積。"}
        - {id: optim.errors, name: 錯誤處理, kind: error, visibility: hidden, requiredBy: [mlp.train], description: "空的 params、重複的參數、lr ≤ 0、momentum 或 betas 超出 [0, 1)、weight_decay < 0、max_norm ≤ 0,都要 ValueError。"}
        - id: optim.perf
          name: 效能
          kind: perf
          visibility: hidden
          description: "每一步是 O(參數個數),不能每步重建狀態。"
          perf: {statement: "10^4 個參數、300 次 Adam step 2 秒內(SGD＋動量同樣規模也是)", seconds: 2, n: 10000}
          perf_ref: "Adam 0.45 秒、SGD＋動量 0.18 秒"
          requiredBy: [mlp.perf]

    - id: nn/mlp
      order: 5
      name: 多層感知機
      files: [nn/mlp.py]
      language: python
      chapter: "111-deep-learning-math:本章 Lab:多層感知機 nn/mlp.py"
      evidenceFor: [ai-mlp]
      consumes: [nn/value, nn/linear, nn/optim]
      lab_no: L5
      anchor: lab-nn-mlp
      also_chapters: [38-machine-learning]
      used_by: [boss.mnist, boss.gradcheck, boss.report]
      note: "和書上範例的差別:第 38 章的 train_mlp／forward／backward 是 numpy、一個隱藏層、sigmoid 輸出的二元分類;第 111 章是 numpy 的單筆前向與反向,以及照 micrograd 保留的 Neuron／Layer／MLP(權重 random.uniform(−1, 1)、SVM max-margin 損失、整張 Value 計算圖訓練、標籤 ±1、單一輸出分數)。Lab 是純 Python、任意層數、softmax 多類別,參數是你的 Value(給最佳化器用),而且有兩條反向傳播:value_loss 建整張計算圖(慢,當標準答案)、loss_and_backward 手推(快,拿來訓練),兩者必須一致;另外規定 He 初始化的亂數、parameters() 的順序、save／load 與 train_digits。隱藏的梯度檢查避開 ReLU 的折點(預激活離 0 至少 1e-3)。給 9Jang:mlp.train(XOR)對亂數很敏感(審查實測 seed 16、17、33、34、37 時正確的實作也會讓 ReLU 死掉),判題要用固定、用參考解驗證過的 seed(公開範例的 seed=0 已驗過),或把隱藏層加寬、步數加多。手算(111):參數量(例 64-64-10 是 4,810 個)與每一層 δ、∂L/∂W 的形狀;一個隱藏層的小網路手推一步反向傳播(運算式答案)。反例題建議:「權重全部初始化成 0 也能訓練」(同一層的神經元永遠一樣)。"
      interface:
        - "class MLP(sizes, seed=0)            # sizes 例 [64, 64, 10];隱藏層 ReLU、最後一層輸出 logits;rng = random.Random(seed) 只建一次,權重照 parameters() 的順序每個抽一次 rng.gauss(0, √(2/fan_in))(He 初始化:第 1 層 W[0][0]、W[0][1]…、W[1][0]…,再第 2 層…);偏差直接是 0,不抽亂數;len(sizes) < 2 或有 < 1 的數 → ValueError"
        - "parameters() -> list[Value]          # 順序規定:第 1 層的 W(逐列,W[j] 是第 j 個輸出的權重)、b,再來第 2 層的 W、b…"
        - "num_params() -> int"
        - "forward(X) -> list[list[float]]      # 一批資料的 logits;只讀 p.data,不建計算圖"
        - "predict(X) -> list[int]              # 同分取最小的類別"
        - "value_loss(X, y, l2=0.0) -> Value    # 用你的 nn.value 建整張計算圖:平均交叉熵＋l2/2·ΣW²(偏差不算);很慢,只給小批次與梯度檢查"
        - "loss_and_backward(X, y, l2=0.0) -> float   # 手推的反向傳播(不建圖),把梯度累加進每個參數的 .grad;要和 value_loss(X, y, l2).backward() 一致"
        - "save(path) -> None;MLP.load(path) -> MLP   # JSON:sizes 與全部參數;load 回來的 forward 一模一樣"
        - "train_digits(X, y, seed=0) -> model     # Boss 呼叫:X 是 0–16 的整數像素(每張 64 個),回傳有 predict(X) 的物件(收原始像素,前處理自己做);必須用這個檔案的 MLP 與 nn.optim 的最佳化器;同一個 seed 結果一樣"
        - "錯誤:X 的維度和 sizes[0] 不同、標籤不在 0..sizes[-1]−1 → ValueError"
      forbid: [numpy, torch, sklearn]
      require: [nn.value, nn.optim, nn.linear]
      groups:
        - {id: mlp.forward, name: 前向傳播, kind: function, visibility: public, requiredBy: [boss.mnist, boss.gradcheck], description: "依 parameters() 的順序填好參數後,forward 與 predict 對公開範例;num_params。"}
        - {id: mlp.loss, name: 兩條反向傳播一致, kind: function, visibility: public, requiredBy: [boss.gradcheck], description: "公開的小網路:value_loss 與 loss_and_backward 的損失一樣,backward 之後每個參數的梯度也一樣。"}
        - {id: mlp.train, name: 訓練小資料, kind: function, visibility: public, requiredBy: [boss.mnist], description: "分得開的四群 XOR 型資料(線性模型分不開):用你的 Adam 訓練之後訓練準確率 100%、損失下降。"}
        - {id: mlp.gradcheck, name: 梯度檢查, kind: function, visibility: hidden, requiredBy: [boss.gradcheck], description: "隨機的 2–4 層小網路、隨機資料、有沒有 l2:loss_and_backward 的梯度對有限差分(相對誤差 1e-5)、對 value_loss().backward()(1e-9)。"}
        - {id: mlp.init, name: 初始化, kind: spec, visibility: hidden, requiredBy: [boss.mnist], description: "同一個 seed 參數一樣、不同 seed 不一樣;權重的平均約 0、標準差約 √(2/fan_in)(統計檢定);偏差是 0;parameters() 的長度與順序。"}
        - {id: mlp.spec, name: 規格細節, kind: spec, visibility: hidden, requiredBy: [boss.mnist, boss.gradcheck], description: "loss_and_backward 是累加(呼叫兩次梯度變兩倍);ReLU 在 0 的梯度是 0;logits 很大也不溢位;save／load 往返一模一樣;train_digits 同一個 seed 結果一樣。"}
        - {id: mlp.errors, name: 錯誤處理, kind: error, visibility: hidden, requiredBy: [boss.mnist], description: "sizes 不對、X 的維度和 sizes[0] 不同、標籤超出範圍,都要 ValueError。"}
        - id: mlp.perf
          name: 效能
          kind: perf
          visibility: hidden
          description: "訓練要用手推的 loss_and_backward;用 value_loss 建圖訓練一個 epoch 要好幾分鐘。"
          perf: {statement: "64-64-10 網路、4,000 筆、batch 32 跑一個 epoch(loss_and_backward＋Adam step)6 秒內", seconds: 6, n: 4000, budget: {optim.perf: 1}, usage: {optim.perf: 0.2}}
          perf_ref: "1.28 秒(審查時 1.47 秒;9Jang 規則 max(1 秒, 參考解 × 4) → 6 秒。64-32-10 是 0.64 秒;用 value_loss 建圖約 300 秒)。一個 epoch 的 Adam 更新量是 4,810 個參數 × 125 次 step,約 optim.perf(10^4 × 300)的 0.2 倍"
          requiredBy: [boss.mnist]

