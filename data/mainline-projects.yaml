        - "python3 hack/assembler.py Prog.asm             # 產生同目錄的 Prog.hack;符號表可以用 libds/hashmap(選用)"
        - "python3 hack/assembler.py Prog.asm --symbols   # 另外寫出 Prog.sym:先列標籤(依原始碼順序)「label <名稱> <ROM 位址>」,再列變數(依配置順序)「var <名稱> <RAM 位址>」;不列預先定義的符號"
        - "錯誤:只報行號最小的那個錯誤,stderr 印一行「<檔名>:<行號>: <原因>」(檔名照命令列參數原樣;行號是原始檔的行號,從 1 起算;原因的文字不規定),結束狀態碼 1,不寫出 .hack 與 .sym(已經有的舊檔不動);合法的符號由英文字母、數字、_ . $ : 組成,不能以數字開頭"
      note: "書上的 assemble() 接上練習 22.6 的解答(讀標準輸入、寫標準輸出)不讀檔名參數、沒有 --symbols、也丟掉了行號,所以在 assembler.public、assembler.symfile(公開)與 assembler.errors(隱藏)都會失敗:9Jang lab:verify 的書本突變版(mutants/book-*)至少一組失敗。symfile 與 errors 只由 boss.own-program(自己寫程式時要看得懂錯誤與變數位址)需要;boss.rain 只要求組譯結果逐行相同,這是刻意的取捨。"
