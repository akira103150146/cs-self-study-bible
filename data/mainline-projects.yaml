    - id: libds/hashmap
      order: 4
      name: 雜湊表
      files: [libds/hashmap.py]
      language: python
      chapter: "29-data-structures:本章 Lab:雜湊表 libds/hashmap.py"
      evidenceFor: [t-adv-ds]
      consumes: []
      lab_no: L3
      anchor: lab-libds-hashmap
      used_by: [search/index]
      interface:
        - "class HashMap()                   # 開放定址(線性探測)＋墓碑"
        - "put(key, value) -> None           # 更新既有的 key 不改它的順序"
        - "get(key, default=None)"
        - "pop(key)                          # 回傳 value;找不到 → KeyError;pop 之後再 put 算新的插入(排到最後)"
        - "__len__() -> int;__iter__()       # 依插入順序產生 key"
        - "check() -> bool                   # 不變式:size 和實際筆數一致、(live＋墓碑)/m ≤ 0.7、每個 key 都找得到"
      internal: "self.index:list[int](-1 空、-2 墓碑、≥ 0 是 self.entries 的位置);self.entries:list[(key, value) | None](依插入順序);self.size:筆數(live)。m＝len(self.index),最小 8。(live＋墓碑)/m > 0.7 就擴成兩倍;pop 後 live/m < 0.2 而且 m > 8 就縮成一半;擴縮時清掉墓碑、壓緊 entries。"
      forbidAttrTypes: [dict, set]
      invariants:
        - name: hashmap.invariant
          kind: function
          symbol: HashMap.check
          sabotage: {attr: [index, entries, size], breaks: [set-size-wrong, drop-bucket-entry]}
      groups:
        - {id: hashmap.basic, name: 基本操作, kind: function, visibility: public, requiredBy: [boss.hashmap], description: "put、get、pop、len 對 dict 參考模型。"}
        - {id: hashmap.order, name: 插入順序, kind: spec, visibility: public, requiredBy: [boss.hashmap], description: "for 迴圈依插入順序;更新不改順序;pop 之後再 put 排到最後。"}
        - {id: hashmap.tombstone, name: 墓碑, kind: edge, visibility: hidden, requiredBy: [boss.hashmap], description: "刪除之後再找、刪除之後再放;很多 key 的雜湊值相同(自訂 __hash__);負數、字串、tuple 當 key。"}
        - {id: hashmap.resize, name: 擴容與縮容, kind: edge, visibility: hidden, requiredBy: [boss.hashmap], description: "(live＋墓碑)/m > 0.7 時擴容,擴完全部找得到;live/m < 0.2 而且 m > 8 時縮容(最小 8),縮完照樣找得到、順序不變。"}
        - {id: hashmap.errors, name: 錯誤處理, kind: error, visibility: hidden, requiredBy: [boss.hashmap], description: "pop 不存在的 key 要丟 KeyError;get 不存在的 key 回傳 default。"}
        - {id: hashmap.invariant, name: 表的不變式一直成立, kind: invariant, visibility: hidden, requiredBy: [boss.hashmap], description: "隨機操作的每一步之後 check() 都成立;故意把 size 改錯或弄丟一格時,check() 要抓得到。"}
        - id: hashmap.perf
          name: 效能
          kind: perf
          visibility: hidden
          description: "平均 O(1) 的 put、get、pop。"
          perf: {statement: "2×10^5 次 put＋10^5 次 pop＋2×10^5 次 get,2 秒內", seconds: 2, n: 200000}
          perf_ref: "0.48 秒"
          requiredBy: [boss.hashmap, search-suggest, agent/boss.search-quality]

