        - "kruskal(n, edges) -> (total, chosen)   # edges=[(w, u, v), …];chosen 依加入順序;同權重依輸入順序;不連通 → ValueError;必須用 libds.sort.stable_sort 排邊(書端決定)"
      require: [libds.sort]
      invariants:
        - {name: dsu.invariant, kind: function, symbol: DSU.check}
      groups:
        - {id: dsu.basic, name: 基本操作, kind: function, visibility: public, requiredBy: [boss.dsu], description: "find、union、same、size_of、components 對公開範例;union 依大小合併,一樣大時 b 的根接到 a 的根下。"}
        - {id: dsu.kruskal, name: 最小生成樹, kind: function, visibility: public, requiredBy: [boss.dsu], description: "kruskal 的總權重與依加入順序的邊;只依權重做穩定排序,同權重依輸入順序(不是依 (w, u, v) 整組排)。"}
        - {id: dsu.edge, name: 邊界, kind: edge, visibility: hidden, requiredBy: [boss.dsu], description: "同一組再 union 回傳 False;n=1;自迴圈的邊;重邊。"}
        - {id: dsu.errors, name: 錯誤處理, kind: error, visibility: hidden, requiredBy: [boss.dsu], description: "元素超出範圍要 IndexError;kruskal 不連通要 ValueError。"}
        - {id: dsu.deep, name: 很長的鏈, kind: edge, visibility: hidden, requiredBy: [boss.dsu], description: "10^5 個元素串成一條鏈之後 find 不能 RecursionError。"}
        - {id: dsu.invariant, name: 森林的不變式一直成立, kind: invariant, visibility: hidden, requiredBy: [boss.dsu], description: "隨機 union／find 的每一步之後 check() 都成立。"}
        - id: dsu.perf
          name: 效能
          kind: perf
          visibility: hidden
          description: "路徑壓縮＋依大小合併,幾乎是常數時間。"
          perf: {statement: "n=10^5:2×10^5 次 union／same,1 秒內", seconds: 1, n: 200000}
          perf_ref: "0.12 秒"
          requiredBy: [boss.dsu, dsu.kruskal-perf]
        - id: dsu.kruskal-perf
          name: Kruskal 效能
          kind: perf
          visibility: hidden
          description: "排邊 O(m log m)＋並查集。"
          perf: {statement: "n=10^5、m=2×10^5 的 kruskal,2 秒內", seconds: 2, n: 200000}
          perf_ref: "0.59 秒"
          requiredBy: [boss.dsu, network-build]

