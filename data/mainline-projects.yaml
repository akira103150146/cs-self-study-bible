    - {id: cp2.consistency, name: 資料一致, visibility: hidden, checkpoint: proj-be-todo-api, consumes: [bookapi/repo, bookapi/api, srv/pool], description: "隱藏測試類別「資料一致」:借還之後的可借本數、重複還書、刪除有人借的書;同時借最後一本只能成功一次。"}
    - {id: cp2.spec, name: 規格細節, visibility: hidden, checkpoint: proj-be-todo-api, consumes: [bookapi/api], description: "隱藏測試類別「規格細節」:201／204 的用法、Content-Type、列表排序與分頁、PATCH 只改給的欄位。"}
    - {id: cp2.load, name: 借還負載, visibility: hidden, checkpoint: proj-be-todo-api, consumes: [srv/pool, bookapi/repo, bookapi/api], description: "借書 API 掛在自己的多執行緒伺服器上,很多人同時借還也不會超借。", perf: {statement: "100 個客戶端同時各借還 10 次:零錯誤、沒有超借,10 秒內", seconds: 10, n: 1000}}
